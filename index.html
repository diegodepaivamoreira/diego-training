<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Training PRO</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
#app{max-width:520px;margin:auto}

.title{color:#d4ff00;font-size:26px;padding:20px;font-weight:bold}

.chips{display:flex;gap:8px;overflow:auto;padding:10px}
.chip{background:#222;padding:10px;border-radius:20px}
.active{background:#d4ff00;color:#000}

.card{background:#111;margin:10px;padding:15px;border-radius:12px}

.exercise{margin-top:12px;padding-top:10px;border-top:1px solid #222}

.tag{font-size:11px;background:#222;padding:4px 8px;border-radius:6px;margin-bottom:6px}

.series{display:flex;gap:6px;margin-top:6px}
input{width:55px;padding:6px;background:#000;border:1px solid #333;color:#fff}

.check{
width:24px;height:24px;border-radius:50%;
border:2px solid #444;
}
.done{background:#00e676}

.btn{
background:#d4ff00;color:#000;padding:12px;
border:none;border-radius:10px;width:100%;margin-top:15px;
}
</style>
</head>

<body>

<div id="app">
<div class="title">DIEGO TRAINING</div>

<div class="chips" id="chips"></div>
<div id="screen"></div>

</div>

<script>

// ===== TREINOS 100% CORRETOS =====
const treinos = {

Peito:[
{tipo:"TRI-SET",ex:[
"Supino declinado HBL",
"Cross over",
"Crucifixo declinado HBC"
]},
{tipo:"TRI-SET",ex:[
"Supino reto HBL",
"Supino reto HBC",
"Crucifixo máquina"
]},
{tipo:"TRI-SET",ex:[
"Supino 45 HBL",
"Supino 45 HBC",
"Crucifixo 45 HBC"
]}
],

Costas:[
{tipo:"TRI-SET",ex:[
"Barra fixa frente",
"Puxada hammer",
"Puxada frente paralela"
]},
{tipo:"TRI-SET",ex:[
"Puxada por trás",
"Puxada articulada",
"Puxada frente paralela"
]},
{tipo:"TRI-SET",ex:[
"Remada inclinada",
"Remada unilateral HBC",
"Remada sentada"
]}
],

Anterior:[
{tipo:"SEQUÊNCIA",ex:[
"Agachamento Smith",
"Leg press 45",
"Leg horizontal",
"Cadeira extensora",
"Agachamento unilateral Smith",
"Cadeira adutora",
"Abdominal lateral prancha"
]}
],

Ombros:[
{tipo:"TRI-SET",ex:[
"Abdução HBC",
"Cross posterior unilateral",
"Abdução cotovelos"
]},
{tipo:"TRI-SET",ex:[
"Desenvolvimento máquina",
"Flexão ombro HBC",
"Flexão cross"
]},
{tipo:"BI-SET",ex:[
"Desenvolvimento Smith atrás",
"Crucifixo inverso máquina"
]},
{tipo:"TRI-SET",ex:[
"Encolhimento HBC",
"Remada alta cross",
"Encolhimento máquina"
]}
],

Bracos:[
{tipo:"TRI-SET",ex:[
"Rosca direta HBM",
"Rosca Scott máquina",
"Rosca alternada HBC"
]},
{tipo:"TRI-SET",ex:[
"Tríceps testa HBW",
"Tríceps pulley",
"Tríceps corda"
]},
{tipo:"ISOLADO",ex:[
"Rosca martelo"
]}
],

Posterior:[
{tipo:"SEQUÊNCIA",ex:[
"Cadeira flexora",
"Cadeira abdutora",
"Mesa flexora",
"Stiff",
"Flexão joelho em pé",
"Afundo banco",
"Panturrilha em pé",
"Abdominal infra"
]}
]

};

const ordem = ["Peito","Costas","Anterior","Ombros","Bracos","Posterior"];

let atual="Peito";
let dados = JSON.parse(localStorage.getItem("dados")||"{}");

// ===== CHIPS =====
function init(){
let html="";
ordem.forEach(t=>{
html+=`<div class="chip" onclick="abrir('${t}',this)">${t}</div>`;
});
document.getElementById("chips").innerHTML=html;
abrir("Peito", document.querySelector(".chip"));
}

// ===== ABRIR =====
function abrir(nome,el){
atual=nome;

document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
if(el) el.classList.add("active");

render();
}

// ===== RENDER =====
function render(){

let treino = treinos[atual];
let html=`<div class="card"><h2>${atual}</h2>`;

treino.forEach((bloco,b)=>{

html+=`<div class="exercise">`;
html+=`<div class="tag">${bloco.tipo}</div>`;

bloco.ex.forEach((ex,i)=>{
html+=`<div>${ex}</div>`;
});

html+=renderSeries(b,3);
html+=`</div>`;

});

html+=`<button class="btn" onclick="alert('Treino salvo')">Finalizar</button></div>`;

document.getElementById("screen").innerHTML=html;
}

// ===== SERIES =====
function renderSeries(b,total){

let html="";

for(let s=0;s<total;s++){

let v=dados[atual]?.[b]?.[s]||{};

html+=`
<div class="series">
<input value="${v.kg||""}" placeholder="kg"
oninput="save(${b},${s},'kg',this.value)">

<input value="${v.rep||""}" placeholder="rep"
oninput="save(${b},${s},'rep',this.value)">

<div class="check ${v.done?'done':''}"
onclick="toggle(${b},${s})"></div>
</div>
`;
}

return html;
}

// ===== SAVE =====
function save(b,s,k,v){
dados[atual]=dados[atual]||{};
dados[atual][b]=dados[atual][b]||{};
dados[atual][b][s]=dados[atual][b][s]||{};
dados[atual][b][s][k]=v;

localStorage.setItem("dados",JSON.stringify(dados));
}

// ===== TOGGLE (CORRIGIDO) =====
function toggle(b,s){

dados[atual]=dados[atual]||{};
dados[atual][b]=dados[atual][b]||{};
dados[atual][b][s]=dados[atual][b][s]||{};

dados[atual][b][s].done = !dados[atual][b][s].done;

localStorage.setItem("dados",JSON.stringify(dados));

render(); // 🔥 ESSENCIAL PRA FUNCIONAR
}

// INIT
init();

</script>

</body>
</html>
