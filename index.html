<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#080808"/>
<title>Diego Training</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#080808;color:#f0f0f0;font-family:'DM Sans',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input,textarea,select,button{font-family:'DM Sans',sans-serif;}
:root{
  --acc:#d4ff00;--green:#00e676;--red:#ff4500;--cyan:#00e5ff;
  --bg:#080808;--s1:#111;--s2:#181818;--s3:#202020;
  --border:#282828;--text:#f0f0f0;--text2:#aaa;--text3:#555;
}
#app{display:flex;flex-direction:column;height:100dvh;position:relative;overflow:hidden;}
.screen{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
nav{display:flex;background:var(--s1);border-top:1px solid var(--border);flex-shrink:0;}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:10px;font-weight:500;}
nav button.active{color:var(--acc);}
nav svg{width:20px;height:20px;}
.bebas{font-family:'Bebas Neue',cursive;}
.btn-acc{background:var(--acc);color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;}
.label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600;}
/* timer overlay */
#timer-overlay{position:absolute;inset:0;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;}
#timer-overlay.visible{display:flex;}
/* toast */
#toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:9px 20px;border-radius:20px;font-weight:700;font-size:13px;z-index:300;display:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <div id="screen-dash" class="screen"></div>
  <div id="screen-treino" class="screen" style="display:none"></div>
  <div id="screen-period" class="screen" style="display:none"></div>
  <div id="screen-evol" class="screen" style="display:none"></div>
  <div id="screen-profile" class="screen" style="display:none"></div>

  <nav>
    <button class="active" onclick="goTab('dash')" id="nav-dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Início
    </button>
    <button onclick="goTab('treino')" id="nav-treino">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>Treino
    </button>
    <button onclick="goTab('period')" id="nav-period">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Ciclo
    </button>
    <button onclick="goTab('evol')" id="nav-evol">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Evolução
    </button>
    <button onclick="goTab('profile')" id="nav-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Perfil
    </button>
  </nav>

  <div id="timer-overlay">
    <div class="label" style="margin-bottom:16px">Descanso</div>
    <div style="position:relative;width:190px;height:190px;margin-bottom:18px">
      <svg width="190" height="190" viewBox="0 0 190 190" style="transform:rotate(-90deg)">
        <circle cx="95" cy="95" r="83" fill="none" stroke="var(--s3)" stroke-width="8"/>
        <circle id="timer-arc" cx="95" cy="95" r="83" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="521" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear,stroke .3s"/>
      </svg>
      <div id="timer-num" class="bebas" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:68px;letter-spacing:4px;line-height:1"></div>
    </div>
    <div id="timer-go" class="bebas" style="font-size:26px;letter-spacing:4px;color:var(--acc);min-height:32px;margin-bottom:6px"></div>
    <div id="timer-next" style="font-size:12px;color:var(--text3);text-align:center;max-width:240px;line-height:1.4;min-height:36px;padding:0 20px"></div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
      <button onclick="timerAdj(-15)" style="background:var(--s2);color:var(--text3);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer">−</button>
      <span id="timer-tot-lbl" style="font-size:12px;color:var(--text3);min-width:56px;text-align:center;font-weight:600"></span>
      <button onclick="timerAdj(15)" style="background:var(--s2);color:var(--text3);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer">+</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button onclick="closeTimer()" style="background:var(--s2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 26px;font-size:14px;font-weight:600;cursor:pointer">Pular ▶</button>
      <button onclick="closeTimer()" style="background:none;color:var(--text3);border:1px solid var(--border);border-radius:12px;padding:11px 26px;font-size:14px;cursor:pointer">Cancelar</button>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script>
// ── DATA ──
const WC=[
  {num:1,name:"Volume Base",desc:"Volume total e conexão neuromuscular. Carga moderada-alta, execução impecável.",series:3,reps:"10",rest:60,drop:false},
  {num:2,name:"Sobrecarga Progressiva",desc:"Carga 10-15% maior. Menos reps, mais intensidade. Recrutamento máximo.",series:4,reps:"8",rest:75,drop:false},
  {num:3,name:"Choque Metabólico",desc:"Rep range alto, descanso curto, drop-set na última série de cada tri-set.",series:3,reps:"12-15",rest:45,drop:true},
  {num:4,name:"Deload Ativo",desc:"Volume e carga reduzidos. Foco em execução, amplitude e recuperação tecidual.",series:2,reps:"10",rest:60,drop:false},

const DAYS=[
  {id:"peito",label:"PEITO",short:"Pei",wd:"Seg",sub:"Peitoral · Tri-sets",trisets:[
    {label:"Tri-set 1",ex:[

  {id:"biceps",label:"BÍC/TRIC",short:"BT",wd:"Sex",sub:"Bíceps e Tríceps",trisets:[

      {n:"Elevação de Pernas",t:"3x15. Lombar colada no chão. Desce lentamente."},
      {n:"Prancha Frontal",t:"3x45s. Quadril neutro. Respira normalmente."},
      {n:"Abdominal Oblíquo / Bicicleta",t:"3x20 alternados. Rotação real do tronco."},
      {n:"Hollow Body Hold",t:"2x30s. Lombar no chão, braços e pernas levemente elevados."},
    ]},
  ]},
];

const SK="dt_v1";
let DB={week:1,sets:{},done:{},obs:{},weights:[],selEx:""};
let currentTab="dash";
let currentDayIdx=0;
let timerInterval=null;
let timerRem=0,timerTot=0,timerNext="";

function load(){try{const s=localStorage.getItem(SK);if(s)DB={...DB,...JSON.parse(s)};}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function w(){return WC[(DB.week-1)%4];}
function todayStr(){return new Date().toISOString().slice(0,10);}
function doneKey(id){return id+"_"+todayStr();}
function isDone(id){return !!DB.done[doneKey(id)];}
function lastDone(id){
  const prefix=id+"_";
  const dates=Object.keys(DB.done).filter(k=>k.startsWith(prefix)&&DB.done[k]).map(k=>k.slice(prefix.length)).sort().reverse();
  return dates[0]||null;
}
function sk(d,ti,ei,si){return d+"_"+ti+"_"+ei+"_"+si;}
function getSet(d,ti,ei,si){return DB.sets[sk(d,ti,ei,si)]||{kg:"",reps:"",done:false};}
function setSet(d,ti,ei,si,f,v){const k=sk(d,ti,ei,si);DB.sets[k]={...DB.sets[k]||{kg:"",reps:"",done:false},[f]:v};save();}
function markDone(id,v){DB.done[doneKey(id)]=v;save();}
function nSets(ts){return ts.single?3:w().series;}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",2400);
}

// ── TIMER ──
function startTimer(next){
  clearInterval(timerInterval);
  timerTot=w().rest; timerRem=timerTot; timerNext=next||"";
  updateTimerUI();
  document.getElementById("timer-overlay").classList.add("visible");
  document.getElementById("timer-go").textContent="";
  timerInterval=setInterval(()=>{
    timerRem--;
    updateTimerUI();
    if(timerRem<=0){
      clearInterval(timerInterval);
      document.getElementById("timer-go").textContent="VÁ!";
      document.getElementById("timer-arc").style.stroke="var(--green)";
      try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300]);}catch(e){}
      playBeep();
      setTimeout(closeTimer,2000);
    }
  },1000);
}
function updateTimerUI(){
  const circ=521;
  document.getElementById("timer-num").textContent=timerRem;
  document.getElementById("timer-arc").style.strokeDashoffset=circ*(1-timerRem/timerTot);
  document.getElementById("timer-arc").style.stroke=timerRem<=10?"var(--red)":"var(--acc)";
  document.getElementById("timer-tot-lbl").textContent=timerTot+"s";
  document.getElementById("timer-next").textContent=timerNext?"Próximo: "+timerNext:"";
}
function timerAdj(d){timerTot=Math.min(300,Math.max(15,timerTot+d));timerRem=Math.max(1,timerRem+d);updateTimerUI();}
function closeTimer(){clearInterval(timerInterval);document.getElementById("timer-overlay").classList.remove("visible");}
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[0,880],[0.18,1100],[0.36,880]].forEach(([t,f])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type="sine";
      g.gain.setValueAtTime(0.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.15);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.16);
    });
  }catch(e){}
}

// ── NAV ──
function goTab(tab){
  currentTab=tab;
  ["dash","treino","period","evol","profile"].forEach(t=>{
    document.getElementById("screen-"+t).style.display=t===tab?"flex":"none";
    const nb=document.getElementById("nav-"+t);
    if(nb)nb.classList.toggle("active",t===tab);
  });
  render();
}
function goDay(i){currentDayIdx=i;goTab("treino");}

// ── RENDER ──
function render(){
  if(currentTab==="dash")renderDash();
  else if(currentTab==="treino")renderTreino();
  else if(currentTab==="period")renderPeriod();
  else if(currentTab==="evol")renderEvol();
  else if(currentTab==="profile")renderProfile();
}

function renderDash(){
  const jsDay=new Date().getDay();
  const dayMap={1:0,2:1,3:2,4:3,5:4,6:5,0:6};
  const ti=dayMap[jsDay]??0;
  const day=DAYS[ti];
  const done=isDone(day.id);
  const lW=DB.weights.length?DB.weights[DB.weights.length-1].val:null;

function toggleSetDone(d,ti,ei,si,next){

render();
}

render();
}

graphHTML=`<div class="card" style="padding:14px;margin-bottom:12px"> <div class="label" style="margin-bottom:12px">Peso Corporal (kg)</div> <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px"> <polyline points="${pts}" fill="none" stroke="#d4ff00" stroke-width="2.5" stroke-linejoin="round"/> ${vals.map((v,i)=>`<circle cx="${i*xs}" cy="${H-((v-mn)/(mx-mn))*H}" r="3.5" fill="#d4ff00"/>`).join("")} </svg> <div style="display:flex;justify-content:space-between;margin-top:6px"> <span style="font-size:10px;color:#555">${ws[0].date}</span> <span style="font-size:10px;color:#555">${ws[ws.length-1].date}</span> </div> </div>`;
}

}
