<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Diego Training</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#f0f0f0;font-family:Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{display:flex;background:#111;border-top:1px solid #282828;flex-shrink:0}
.nb{flex:1;background:none;border:none;color:#555;font-size:9px;padding:8px 1px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:Arial}
.nb.on{color:#d4ff00}
.nb svg{width:20px;height:20px}
.pg{padding:14px 14px 80px}
.card{background:#111;border:1px solid #282828;border-radius:12px;margin-bottom:10px;overflow:hidden}
.cp{padding:12px 14px}
.ttl{font-size:24px;font-weight:900;letter-spacing:2px;color:#d4ff00;margin-bottom:2px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#555;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1a1a1a}
.row:last-child{border-bottom:none}
input[type=number]{-webkit-appearance:none;appearance:none;background:#0a0a0a;border:1px solid #282828;border-radius:6px;color:#f0f0f0;font-size:13px;font-weight:700;text-align:center;padding:4px 2px;width:42px;font-family:Arial}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=text]{background:#0a0a0a;border:1px solid #282828;border-radius:6px;color:#f0f0f0;font-size:13px;padding:6px 8px;width:100%;font-family:Arial;margin-bottom:4px}
textarea{background:#111;border:1px solid #282828;border-radius:10px;color:#f0f0f0;font-size:13px;padding:10px;resize:none;width:100%;font-family:Arial;min-height:60px}
select{background:#111;border:1px solid #282828;border-radius:8px;color:#f0f0f0;font-size:13px;padding:10px;width:100%;font-family:Arial;margin-bottom:10px}
.btn{display:block;width:100%;background:#d4ff00;color:#000;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:Arial;margin-top:8px}
.btnd{background:#1a1a1a;color:#555;border:1px solid #282828}
.btng{background:#00e676;color:#000}
.btnr{background:#ff4500;color:#fff;border:none}
.btncyan{background:#00e5ff;color:#000;border:none}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #282828;background:transparent;cursor:pointer;font-size:10px;color:transparent;flex-shrink:0;font-family:Arial;display:inline-flex;align-items:center;justify-content:center}
.ckon{background:#00e676;border-color:#00e676;color:#000}
#tmr{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center;padding:20px}
#tnum{font-size:88px;font-weight:900;color:#d4ff00;line-height:1}
#tst{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:20px;font-weight:700;font-size:13px;z-index:1000;display:none;pointer-events:none;white-space:nowrap;background:#00e676;color:#000}
.tab-btn{padding:6px 11px;border-radius:20px;border:1px solid #282828;background:transparent;color:#555;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:Arial}
.tab-btn.on{background:#d4ff00;color:#000;border-color:#d4ff00;font-weight:700}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:800;display:none;flex-direction:column}
.modal.on{display:flex}
.modal-inner{background:#111;border-radius:16px 16px 0 0;margin-top:auto;padding:20px;max-height:85vh;overflow-y:auto}
/* Conquistas */
.badge-card{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border-radius:10px;border:1px solid #282828;background:#111;min-width:80px;text-align:center}
.badge-card.earned{border-color:#d4ff00;background:#1a2000}
.badge-icon{font-size:28px;line-height:1}
/* Calendário */
.cal-day{width:13.5%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
/* Sugestão de carga */
.sug{background:#1a1500;border:1px solid #ff9100;border-radius:6px;padding:4px 8px;font-size:10px;color:#ff9100;margin-bottom:5px;display:inline-block}
.reg{background:#1a0500;border:1px solid #ff4500;border-radius:6px;padding:2px 6px;font-size:9px;color:#ff4500;margin-left:4px}
/* Streak */
.streak-fire{font-size:32px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div id="scr"></div>
  <div id="nav">
    <button class="nb on" id="n0" onclick="go(0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Inicio</button>
    <button class="nb" id="n1" onclick="go(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>Treino</button>
    <button class="nb" id="n2" onclick="go(2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Agenda</button>
    <button class="nb" id="n3" onclick="go(3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Evolucao</button>
    <button class="nb" id="n4" onclick="go(4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>Dieta</button>
    <button class="nb" id="n5" onclick="go(5)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Perfil</button>

</div>

<!-- Timer -->
<div id="tmr" onclick="closeT()">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#555;font-weight:600;margin-bottom:10px">DESCANSO · toque para fechar</div>

  <div id="tgo" style="font-size:22px;font-weight:900;color:#00e676;min-height:30px;margin-top:6px"></div>

  </div>
  <div id="tpr" style="margin-top:16px;font-size:14px;color:#ff9100;font-weight:700;min-height:24px"></div>
</div>

<!-- Modal editar exercício -->
<div id="editModal" class="modal">
  <div style="flex:1" onclick="closeEdit()"></div>
  <div class="modal-inner">
    <div id="editTitle" style="font-size:16px;font-weight:700;color:#d4ff00;margin-bottom:14px">Editar Exercicio</div>

    <button onclick="saveEdit()" class="btn">Salvar</button>
    <button onclick="closeEdit()" class="btn btnd">Cancelar</button>

</div>

<!-- Modal conquista -->
<div id="achModal" class="modal" onclick="document.getElementById('achModal').className='modal'">
  <div style="flex:1"></div>
  <div class="modal-inner" style="text-align:center;padding:30px 20px">
    <div id="achIcon" style="font-size:60px;margin-bottom:10px"></div>
    <div id="achTitle" style="font-size:20px;font-weight:900;color:#d4ff00;margin-bottom:6px"></div>
    <div id="achDesc" style="font-size:14px;color:#aaa;margin-bottom:20px"></div>
    <button onclick="document.getElementById('achModal').className='modal'" class="btn">Fechar</button>
  </div>
</div>

<!-- Modal compartilhar -->
<div id="shareModal" class="modal">
  <div style="flex:1" onclick="closeShare()"></div>
  <div class="modal-inner">
    <div style="font-size:16px;font-weight:700;color:#d4ff00;margin-bottom:14px">Resumo do Treino</div>
    <div id="shareContent" style="background:#0a0a0a;border:1px solid #282828;border-radius:10px;padding:14px;font-size:13px;color:#f0f0f0;line-height:1.8;white-space:pre-wrap;font-family:monospace"></div>
    <button onclick="copyShare()" class="btn btncyan" style="margin-top:10px">Copiar para WhatsApp</button>
    <button onclick="closeShare()" class="btn btnd">Fechar</button>
  </div>
</div>

<!-- Modal detalhe do treino -->
<div id="sessionModal" class="modal">
  <div style="flex:1" onclick="closeSession()"></div>
  <div class="modal-inner">
    <div id="sessionTitle" style="font-size:16px;font-weight:700;color:#d4ff00;margin-bottom:14px"></div>
    <div id="sessionContent"></div>
    <button onclick="closeSession()" class="btn btnd" style="margin-top:10px">Fechar</button>
  </div>
</div>

<div id="tst"></div>

<script>
var WC=[
  {num:1,name:"Volume Base",series:3,reps:"10",rest:60,drop:false},
  {num:2,name:"Sobrecarga Progressiva",series:4,reps:"8",rest:75,drop:false},
  {num:3,name:"Choque Metabolico",series:3,reps:"12-15",rest:45,drop:true},
  {num:4,name:"Deload Ativo",series:2,reps:"10",rest:60,drop:false}
];
var MAIN_SEQ=["push","pull","legs","upper","lower"];
var ACHIEV=[
  {id:"a1",icon:"🏋️",title:"Primeiro Treino",desc:"Conclua seu primeiro treino.",check:function(db){return Object.keys(db.done).length>=1;}},
  {id:"a2",icon:"🔥",title:"10 Treinos",desc:"Conclua 10 treinos.",check:function(db){return Object.keys(db.done).filter(function(k){return db.done[k];}).length>=10;}},
  {id:"a3",icon:"💪",title:"Primeiro PR",desc:"Bata seu primeiro recorde.",check:function(db){return Object.keys(db.prs).length>=1;}},
  {id:"a4",icon:"🔄",title:"Ciclo Completo",desc:"Complete 1 ciclo dos 5 treinos (PPLUL).",check:function(db){return db.cycleCount>=1;}},
  {id:"a5",icon:"⚡",title:"3 Ciclos",desc:"Complete 3 ciclos.",check:function(db){return db.cycleCount>=3;}},
  {id:"a6",icon:"🏆",title:"Mestre do PR",desc:"Tenha 10 recordes pessoais.",check:function(db){return Object.keys(db.prs).length>=10;}},
  {id:"a7",icon:"📅",title:"Constancia",desc:"Treine 3 dias seguidos.",check:function(db){return calcStreak(db)>=3;}},
  {id:"a8",icon:"🌊",title:"Deload Ativo",desc:"Complete a semana de Deload.",check:function(db){return db.week===4||db.cycleCount>=1;}},
  {id:"a9",icon:"🎯",title:"100kg no Volume",desc:"Mova mais de 100kg de volume num treino.",check:function(db){return db.maxVol&&db.maxVol>=100;}},
  {id:"a10",icon:"👑",title:"Lendario",desc:"Complete 10 ciclos completos.",check:function(db){return db.cycleCount>=10;}}
];

var DEFAULT_DAYS={
  push:{id:"push",label:"PUSH",short:"Push",sub:"Peito, Ombro e Triceps",trisets:[
    {label:"Composto Pesado",single:true,ex:[{n:"Supino Reto com Barra",t:"PESADO: 3-4 series de 6-8 reps. Desca ate 1cm do esterno. Descanso 2-3 min. Progrida a carga."}]},
    {label:"Tri-set 1 Peito",ex:[{n:"Supino Inclinado com Halteres",t:"Banco a 45 graus. Alongue bem o peito embaixo."},{n:"Crossover Polia Alta",t:"Cruze as maos na frente. Aperte 1s."},{n:"Voador Peck Deck",t:"Tensao constante, sem bater os pesos."}]},
    {label:"Tri-set 2 Ombro",ex:[{n:"Desenvolvimento com Halteres",t:"Sentado. Empurre acima da cabeca."},{n:"Elevacao Lateral Halteres",t:"Polegar leve pra baixo. Ate a linha do ombro."},{n:"Elevacao Lateral na Polia",t:"Unilateral, tensao constante."}]},
    {label:"Tri-set 3 Triceps",ex:[{n:"Triceps Corda na Polia",t:"Separe a corda no final. Extensao total."},{n:"Triceps Testa Barra W",t:"Cotovelos fixos apontando pra cima."},{n:"Triceps Frances Unilateral",t:"Alongamento atras da cabeca."}]}
  ]},
  pull:{id:"pull",label:"PULL",short:"Pull",sub:"Costas, Post. de Ombro e Biceps",trisets:[
    {label:"Composto Pesado",single:true,ex:[{n:"Remada Curvada com Barra",t:"PESADO: 3-4 series de 6-8 reps. Tronco a 45 graus, puxe ate o umbigo. Descanso 2-3 min."}]},
    {label:"Tri-set 1 Costas Largura",ex:[{n:"Barra Fixa Pronada",t:"Pegada larga. Amplitude total, assistida se precisar."},{n:"Puxada Frente na Polia",t:"Peito estufado, puxe com os cotovelos."},{n:"Pullover na Polia Alta",t:"Bracos quase retos. Sinta o dorsal alongar."}]},
    {label:"Tri-set 2 Costas e Post. Ombro",ex:[{n:"Remada Unilateral Halter",t:"Apoie o joelho. Puxe ate o quadril."},{n:"Remada Baixa Polia Neutra",t:"Nao use impulso do tronco."},{n:"Crucifixo Inverso Maquina",t:"Foco no deltoide posterior. Ate paralelo ao solo."}]},
    {label:"Tri-set 3 Biceps",ex:[{n:"Rosca Direta com Barra",t:"Sem balancar o corpo. Supinacao total."},{n:"Rosca Scott",t:"Amplitude total, cadencia lenta."},{n:"Rosca Martelo Halteres",t:"Trabalha braquial e antebraco."}]}
  ]},
  legs:{id:"legs",label:"LEGS",short:"Legs",sub:"Pernas (enfase Quadriceps)",trisets:[
    {label:"Composto Pesado",single:true,ex:[{n:"Agachamento Livre com Barra",t:"PESADO: 3-4 series de 6-8 reps. Desca ate 90 graus, joelhos alinhados. Descanso 2-3 min. O rei das pernas."}]},
    {label:"Quadriceps",single:true,ex:[
      {n:"Leg Press 45",t:"Pes na largura do ombro. Amplitude total."},
      {n:"Agachamento Hack",t:"Foco no quadriceps. Desca controlado."},
      {n:"Cadeira Extensora",t:"Descida lenta 3s. Pausa 1s no topo."}
    ]},
    {label:"Posterior e Gluteo",single:true,ex:[
      {n:"Mesa Flexora",t:"Quadril encaixado. Contracao total."},
      {n:"Cadeira Abdutora",t:"Controle a volta, incline o tronco a frente."}
    ]},
    {label:"Panturrilha",single:true,ex:[{n:"Panturrilha em Pe",t:"5x15-20. Pausa 1s no alto e no baixo."}]}
  ]},
  upper:{id:"upper",label:"UPPER",short:"Up",sub:"Superiores (angulos diferentes)",trisets:[
    {label:"Composto Pesado",single:true,ex:[{n:"Desenvolvimento com Barra",t:"PESADO: 3-4 series de 6-8 reps. Barra ate o queixo, empurre acima da cabeca. Descanso 2-3 min."}]},
    {label:"Tri-set 1 Empurra e Puxa",ex:[{n:"Supino Declinado Maquina",t:"Empurra e segura a contracao 1s."},{n:"Puxada Triangulo Neutra",t:"Pegada fechada neutra. Puxe ao peito."},{n:"Voador Inverso na Polia",t:"Deltoide posterior, tensao constante."}]},
    {label:"Tri-set 2 Espessura",ex:[{n:"Crucifixo Inclinado Halteres",t:"Alongamento maximo embaixo."},{n:"Remada Cavalinho T-Bar",t:"Aperte as escapulas atras."},{n:"Encolhimento com Halteres",t:"Trapezio. Segura 1s no topo."}]},
    {label:"Tri-set 3 Bracos",ex:[{n:"Rosca Alternada Halteres",t:"Rotacao do punho na subida."},{n:"Triceps Pulley Barra",t:"Cotovelos junto ao corpo. Extensao total."},{n:"Rosca Concentrada",t:"Isola o pico do biceps."}]}
  ]},
  lower:{id:"lower",label:"LOWER",short:"Low",sub:"Pernas (enfase Posterior e Gluteo)",trisets:[
    {label:"Composto Pesado",single:true,ex:[{n:"Stiff com Barra",t:"PESADO: 3-4 series de 6-8 reps. Joelho leve flexionado, empurre o quadril pra tras. Sinta o posterior. Descanso 2-3 min."}]},
    {label:"Posterior e Gluteo",single:true,ex:[
      {n:"Cadeira Flexora",t:"Descida lenta 3s."},
      {n:"Mesa Flexora",t:"Quadril encaixado, contracao total."},
      {n:"Elevacao Pelvica com Barra",t:"Hip thrust. Aperte o gluteo no topo 1s."}
    ]},
    {label:"Quadriceps e Adutor",single:true,ex:[
      {n:"Leg Press Pes Altos",t:"Pes altos e afastados p/ posterior e gluteo."},
      {n:"Cadeira Adutora",t:"Pressao constante."}
    ]},
    {label:"Panturrilha e Core",single:true,ex:[{n:"Panturrilha Sentado",t:"3x15. Foco no soleo, amplitude total."},{n:"Abdominal Infra no Banco",t:"3x15. Joelhos dobrados."}]}
  ]},
  cardio:{id:"cardio",label:"CARDIO",short:"Card",sub:"Cardio e Abdome",isCardio:true,trisets:[
    {label:"Cardio",single:true,ex:[{n:"Esteira Inclinada ou Escada",t:"CORTE: 30-40 min zona 2 (FC 120-140), 3-4x/sem. Em jejum ou pos-treino de forca."},{n:"HIIT (opcional)",t:"1-2x/sem: 10-15 min. 30s forte / 90s leve. Evite no mesmo dia de pernas pesado."}]},
    {label:"Abdome",single:true,ex:[
      {n:"Abdominal Supra",t:"3x20."},
      {n:"Elevacao de Pernas",t:"3x15."},
      {n:"Prancha Frontal",t:"3x45s."},
      {n:"Obliquo Bicicleta",t:"3x20 alternados."},
      {n:"Hollow Body Hold",t:"2x30s."}
    ]}
  ]}
};

var AVAL_BASE=[
  {date:"30/12/2025",peso:77.6,gord:12.3,mlg:68,mm:29.4,mgKg:9.6,imc:23.2,cintura:82.5,quadril:98,braco_d_con:38,coxa_d:52,panturrilha_d:37.5},
  {date:"10/02/2026",peso:77.3,gord:10.9,mlg:68.9,mm:30.2,mgKg:8.4,imc:23.1,cintura:83.5,quadril:98,braco_d_con:37.5,coxa_d:51,panturrilha_d:37.5},
  {date:"31/03/2026",peso:80.4,gord:11.3,mlg:71.3,mm:30.9,mgKg:9.1,imc:24,cintura:86.5,quadril:102,braco_d_con:38.5,coxa_d:52,panturrilha_d:38}
];

var SK="dtv5";
var APP_VER="2026-10-11 diario";
var DB={week:1,cycleCount:0,lastDoneId:null,sets:{},done:{},obs:{},weights:[],prs:{},hist:{},aval:[],days:null,selEx:"",earnedAch:[],maxVol:0,trainStart:null,cycle:{},progVer:0,measures:[],migratedV3:false,goal:"cut",snap:{},setsVer:0,dietView:"today",food:{}};
var KEYS=["week","cycleCount","lastDoneId","sets","done","obs","weights","prs","hist","aval","days","selEx","earnedAch","maxVol","trainStart","cycle","progVer","measures","migratedV3","goal","snap","setsVer","dietView","food"];

function load(){
  try{
    var s=localStorage.getItem(SK);
    if(s){var p=JSON.parse(s);for(var i=0;i<KEYS.length;i++){if(p[KEYS[i]]!==undefined)DB[KEYS[i]]=p[KEYS[i]];}
      // Migracao: dados antigos nao tem "ciclo atual". Reconstrua a partir do ultimo treino feito.
      if(p.cycle===undefined){
        DB.cycle={};
        if(DB.lastDoneId){var idx=MAIN_SEQ.indexOf(DB.lastDoneId);for(var m=0;m<=idx;m++){DB.cycle[MAIN_SEQ[m]]=lastDoneDate(MAIN_SEQ[m])||tod();}}
        save();
      }
      // Programa novo (v3 PPLUL): descarta treinos personalizados antigos p/ carregar o programa atualizado.
      if(DB.progVer<3){DB.days=null;DB.progVer=3;save();}
      // Migracao v1: series de treinos ja concluidos ficavam preenchidas pra sempre. Limpa uma vez (o historico fica em DB.hist).
      if(!DB.setsVer){
        var allIds=MAIN_SEQ.concat(["cardio"]);
        for(var ai=0;ai<allIds.length;ai++){if(lastDoneDate(allIds[ai])&&!isDoneToday(allIds[ai])){var pre=allIds[ai]+"_";for(var sk2 in DB.sets){if(sk2.indexOf(pre)===0)delete DB.sets[sk2];}if(DB.obs[allIds[ai]])DB.obs[allIds[ai]]="";}}
        DB.setsVer=1;save();
      }
    }
    // Migracao do app antigo (dtv3 -> dtv5): traz peso corporal e medidas. Roda uma vez, mesmo em instalacao nova.
    if(!DB.migratedV3){
      try{var old=localStorage.getItem("dtv3");if(old){var od=JSON.parse(old);if(od&&typeof od==="object"){
        if(od.weights&&od.weights.length&&DB.weights.length===0)DB.weights=od.weights.map(function(w){return {date:w.date,val:w.val};});
        if(od.measures&&od.measures.length&&DB.measures.length===0)DB.measures=od.measures.slice();
      }}}catch(e){}
      DB.migratedV3=true;save();
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function getDays(){return DB.days||DEFAULT_DAYS;}
function getDay(id){return getDays()[id];}
function wk(){return WC[(DB.week-1)%4];}
// Data local (toISOString usa UTC: depois das 21h em Brasilia cairia no dia seguinte)
function isoD(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function tod(){return isoD(new Date());}
function e1rm(k,r){k=parseFloat(k);r=parseInt(r);if(!k||!r)return 0;return k*(1+r/30);}
function nextTrainingId(){for(var i=0;i<MAIN_SEQ.length;i++){if(!DB.cycle[MAIN_SEQ[i]])return MAIN_SEQ[i];}return MAIN_SEQ[0];}
function isDoneToday(id){return !!DB.done[id+"_"+tod()];}
function lastDoneDate(id){var p=id+"_",res=[];for(var k in DB.done){if(k.indexOf(p)===0&&DB.done[k])res.push(k.slice(p.length));}res.sort();return res.length?res[res.length-1]:null;}
function sk(d,a,b,c){return d+"_"+a+"_"+b+"_"+c;}
function getS(d,a,b,c){var v=DB.sets[sk(d,a,b,c)];return v||{kg:"",reps:"",done:false};}
function setS(d,a,b,c,f,v){var k=sk(d,a,b,c);var o=getS(d,a,b,c);o[f]=v;DB.sets[k]=o;save();}
function ns(ts){return ts.single?3:wk().series;}

// Histórico de cargas por exercício e data
function saveHist(exName,kg,reps){
  if(!kg||!reps)return;
  if(!DB.hist[exName])DB.hist[exName]=[];
  DB.hist[exName].push({date:tod(),kg:parseFloat(kg),reps:parseInt(reps)});
  if(DB.hist[exName].length>50)DB.hist[exName]=DB.hist[exName].slice(-50);
}
function getLastHist(exName){
  var h=DB.hist[exName];
  if(!h||!h.length)return null;
  // pegar último de data diferente de hoje
  for(var i=h.length-1;i>=0;i--){if(h[i].date!==tod())return h[i];}
  return null;
}
function checkPR(exName,kg,reps){
  if(!kg||!reps)return false;
  var kgN=parseFloat(kg),rN=parseInt(reps);
  if(!kgN||!rN)return false;
  var cur=DB.prs[exName];
  if(!cur||kgN>cur.kg||(kgN===cur.kg&&rN>cur.reps)){DB.prs[exName]={kg:kgN,reps:rN,date:tod()};save();return true;}
  return false;
}
function calcStreak(db){
  var doneArr=[];
  for(var k in db.done){if(db.done[k]){var parts=k.split("_");doneArr.push(parts[parts.length-1]);}}
  var unique={};for(var i=0;i<doneArr.length;i++)unique[doneArr[i]]=1;
  var dates=Object.keys(unique).sort().reverse();
  if(!dates.length)return 0;
  // dias locais (meia-noite); tolera 1 dia de descanso entre treinos (PPLUL tem folgas na semana)
  var now0=new Date();var streak=0,cur=new Date(now0.getFullYear(),now0.getMonth(),now0.getDate());
  for(var d=0;d<dates.length;d++){
    var ps=dates[d].split("-");var dt=new Date(+ps[0],+ps[1]-1,+ps[2]);
    var diff=Math.round((cur-dt)/(1000*60*60*24));
    if(diff<=2){streak++;cur=dt;}else break;
  }
  return streak;
}
function checkAchievements(){
  var newOnes=[];
  for(var i=0;i<ACHIEV.length;i++){
    var a=ACHIEV[i];
    if(DB.earnedAch.indexOf(a.id)<0&&a.check(DB)){DB.earnedAch.push(a.id);newOnes.push(a);}
  }
  save();
  if(newOnes.length){showAch(newOnes[0]);}
}
function showAch(a){
  document.getElementById("achIcon").textContent=a.icon;
  document.getElementById("achTitle").textContent="Conquista: "+a.title;
  document.getElementById("achDesc").textContent=a.desc;
  document.getElementById("achModal").className="modal on";
}
// Guarda as series/obs do treino num snapshot e limpa os campos, pra proxima vez comecar zerado.
// added = entradas gravadas em DB.hist (permite desfazer sem apagar o resto do dia).
function archiveSession(id,added){
  var pre=id+"_",snap={sets:{},obs:DB.obs[id]||"",added:added||[]};
  for(var k in DB.sets){if(k.indexOf(pre)===0){snap.sets[k]=DB.sets[k];delete DB.sets[k];}}
  DB.obs[id]="";
  DB.snap[id+"_"+tod()]=snap;
  var ks=Object.keys(DB.snap).sort();while(ks.length>14){delete DB.snap[ks.shift()];}
}
// Desfaz: devolve as series, remove so o que essa conclusao gravou no historico.
function restoreSession(id){
  var key=id+"_"+tod(),snap=DB.snap[key];if(!snap)return;
  for(var k in snap.sets)DB.sets[k]=snap.sets[k];
  DB.obs[id]=snap.obs||"";
  var ad=snap.added||[];
  for(var i=0;i<ad.length;i++){var h=DB.hist[ad[i].n];if(!h)continue;for(var j=h.length-1;j>=0;j--){if(h[j].date===tod()&&h[j].kg===ad[i].kg&&h[j].reps===ad[i].reps){h.splice(j,1);break;}}}
  delete DB.snap[key];
}
function markMainDone(id){
  DB.done[id+"_"+tod()]=true;DB.lastDoneId=id;DB.cycle[id]=tod();
  // Salvar histórico de sets
  var day=getDay(id);var added=[];
  for(var ti=0;ti<day.trisets.length;ti++){var ts=day.trisets[ti];for(var ei=0;ei<ts.ex.length;ei++){var ex=ts.ex[ei];for(var s=0;s<ns(ts);s++){var sv=getS(id,ti,ei,s);if(sv.kg&&sv.reps&&sv.done){saveHist(ex.n,sv.kg,sv.reps);added.push({n:ex.n,kg:parseFloat(sv.kg),reps:parseInt(sv.reps)});}}}}
  // Calcular volume do treino
  var vol=0;for(var ti2=0;ti2<day.trisets.length;ti2++){var ts2=day.trisets[ti2];for(var ei2=0;ei2<ts2.ex.length;ei2++){for(var s2=0;s2<ns(ts2);s2++){var sv2=getS(id,ti2,ei2,s2);if(sv2.kg&&sv2.reps)vol+=parseFloat(sv2.kg)*parseInt(sv2.reps);}}}
  if(vol>DB.maxVol)DB.maxVol=vol;
  // Verificar ciclo completo (baseado no ciclo atual, nao no historico total)
  var cycDone=true;for(var i=0;i<MAIN_SEQ.length;i++){if(!DB.cycle[MAIN_SEQ[i]]){cycDone=false;break;}}
  if(cycDone){DB.cycleCount++;DB.week=(DB.week%4)+1;DB.cycle={};setTimeout(function(){toast("Ciclo "+DB.cycleCount+" completo! Semana "+DB.week+": "+WC[(DB.week-1)%4].name);},500);}
  archiveSession(id,added);
  DB.trainStart=null;save();checkAchievements();
  return vol;
}

function toast(msg,color){
  var t=document.getElementById("tst");
  t.textContent=msg;t.style.background=color||"#00e676";t.style.color=color?"#000":"#000";t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},3500);
}

// Timer (baseado em timestamp: nao congela ao minimizar o app)
var tInt=null,tEnd=0,tTot=0,tNx="",tDone=false,wakeLock=null,audioCtx=null;
function tRemNow(){return Math.max(0,Math.ceil((tEnd-Date.now())/1000));}
function beep(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    var t=audioCtx.currentTime;
    [0,0.55,1.1].forEach(function(off,i){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
      o.type="sine";o.frequency.value=i===2?1320:880;var s=t+off;
      g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.5,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.45);
      o.start(s);o.stop(s+0.45);
    });
  }catch(e){}
}
function startT(nx,prMsg,rs){
  clearInterval(tInt);tTot=rs||wk().rest;tEnd=Date.now()+tTot*1000;tNx=nx||"";tDone=false;
  document.getElementById("tmr").style.display="flex";
  document.getElementById("tgo").textContent="";
  document.getElementById("tnum").style.color="#d4ff00";
  document.getElementById("tpr").textContent=prMsg||"";
  // Desbloqueia audio dentro do gesto (necessario no iOS)
  try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();}catch(e){}
  // Pede permissao de notificacao (uma vez)
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission();}catch(e){}
  updT();
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(wl){wakeLock=wl;}).catch(function(){});}catch(e){}
  tInt=setInterval(function(){if(tRemNow()>0)updT();else finishT();},250);
}
function finishT(){
  if(tDone)return;tDone=true;clearInterval(tInt);
  document.getElementById("tnum").textContent="VAI!";document.getElementById("tnum").style.color="#00e676";
  try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400]);}catch(e){}
  beep();
  try{if(window.Notification&&Notification.permission==="granted")new Notification("Descanso terminou! 💪",{body:tNx?"Proximo: "+tNx:"Bora pra proxima serie!",tag:"rest",renotify:true});}catch(e){}
  setTimeout(closeT,2500);
}
function updT(){var rem=tRemNow();document.getElementById("tnum").textContent=tDone?"VAI!":rem;document.getElementById("tnum").style.color=tDone?"#00e676":(rem<=10?"#ff4500":"#d4ff00");document.getElementById("ttot").textContent=tTot+"s";document.getElementById("tnx").textContent=tNx?"Proximo: "+tNx:"";}
function tadj(d){tTot=Math.min(300,Math.max(15,tTot+d));tEnd=Math.max(Date.now()+1000,tEnd+d*1000);tDone=false;updT();}
function closeT(){clearInterval(tInt);document.getElementById("tmr").style.display="none";if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}}
// Ao voltar pro app (iOS congela timers em 2o plano): recalcula e avisa se o descanso ja acabou
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&document.getElementById("tmr").style.display==="flex"&&!tDone){if(tRemNow()<=0)finishT();else updT();}
});

function fillLast(id,ti,ei,exName){
  var lastH=getLastHist(exName);if(!lastH){toast("Sem registro anterior");return;}
  var n=ns(getDay(id).trisets[ti]);
  for(var s=0;s<n;s++){setS(id,ti,ei,s,"kg",""+lastH.kg);setS(id,ti,ei,s,"reps",""+lastH.reps);}
  toast("Carga anterior preenchida");render();
}

// Compartilhar
var shareText="";
function openShare(id){
  var day=getDay(id);var W=wk();var vol=0;var lines=[];
  // treino ja concluido hoje: as series foram arquivadas no snapshot
  var snapD=isDoneToday(id)&&DB.snap[id+"_"+tod()];
  function gs(ti,ei,s){if(snapD)return snapD.sets[sk(id,ti,ei,s)]||{kg:"",reps:"",done:false};return getS(id,ti,ei,s);}
  lines.push("🏋️ TREINO: "+day.label);
  lines.push("📅 "+new Date().toLocaleDateString("pt-BR"));
  lines.push("⚙️ "+W.name+" · "+W.series+"x"+W.reps+" · "+W.rest+"s descanso");
  lines.push("");
  for(var ti=0;ti<day.trisets.length;ti++){
    var ts=day.trisets[ti];lines.push("[ "+ts.label+" ]");
    for(var ei=0;ei<ts.ex.length;ei++){
      var ex=ts.ex[ei];var exLine=ex.n+": ";var sets=[];
      for(var s=0;s<ns(ts);s++){var sv=gs(ti,ei,s);if(sv.kg&&sv.reps){sets.push(sv.kg+"kg×"+sv.reps);vol+=parseFloat(sv.kg)*parseInt(sv.reps);}}
      if(sets.length)lines.push("  "+exLine+sets.join(" | "));
    }
    lines.push("");
  }
  var prs=[];for(var k in DB.prs){if(DB.prs[k].date===tod())prs.push(k+": "+DB.prs[k].kg+"kg×"+DB.prs[k].reps);}
  if(prs.length){lines.push("🏆 PRs hoje:");for(var i=0;i<prs.length;i++)lines.push("  "+prs[i]);lines.push("");}
  lines.push("📊 Volume total: "+vol.toLocaleString()+"kg");
  lines.push("💪 Diego Training App");
  shareText=lines.join("\n");
  document.getElementById("shareContent").textContent=shareText;
  document.getElementById("shareModal").className="modal on";
}
function copyShare(){try{navigator.clipboard.writeText(shareText).then(function(){toast("Copiado para a area de transferencia!");});closeShare();}catch(e){toast("Selecione o texto e copie manualmente");}}
function closeShare(){document.getElementById("shareModal").className="modal";}

// Detalhe de um treino passado (reconstruido do historico de cargas por data)
function sessionData(id,date){
  var day=getDay(id);var lines="",vol=0,any=false,count=0;
  if(day){
    for(var ti=0;ti<day.trisets.length;ti++){for(var ei=0;ei<day.trisets[ti].ex.length;ei++){
      var nm=day.trisets[ti].ex[ei].n;var h=DB.hist[nm]||[];var sets=[];
      for(var j=0;j<h.length;j++){if(h[j].date===date){sets.push(h[j].kg+"kg × "+h[j].reps);vol+=parseFloat(h[j].kg)*parseInt(h[j].reps);count++;}}
      if(sets.length){any=true;lines+='<div class="row"><span style="font-size:12px;color:#f0f0f0;flex:1;padding-right:8px">'+nm+'</span><span style="font-size:11px;color:#00e676;text-align:right">'+sets.join("  ·  ")+'</span></div>';}
    }}
  }
  return {day:day,lines:lines,vol:vol,any:any,count:count};
}
function showSession(id,date){
  var sd=sessionData(id,date);var day=sd.day,vol=sd.vol,lines=sd.lines,any=sd.any;
  var body=any?('<div class="card" style="padding:0 12px;margin-bottom:10px">'+lines+'</div><div style="text-align:right;font-size:12px;color:#d4ff00;font-weight:700">Volume: '+Math.round(vol).toLocaleString()+'kg</div>'):'<div style="font-size:13px;color:#555;padding:10px 0">Sem cargas registradas neste treino.</div>';
  document.getElementById("sessionTitle").textContent=(day?day.label:id)+" · "+date.slice(8)+"/"+date.slice(5,7)+"/"+date.slice(0,4);
  document.getElementById("sessionContent").innerHTML=body;
  document.getElementById("sessionModal").className="modal on";
}
function closeSession(){document.getElementById("sessionModal").className="modal";}

// Composto pesado precisa de descanso longo; o resto segue a periodizacao da semana

function togS(d,ti,ei,si,nx,exName,rs){

function togDone(id){

// ── AGENDA / CALENDÁRIO ──
function rAgenda(){
  var now=new Date();var year=now.getFullYear();var month=now.getMonth();

  var firstDay=new Date(year,month,1).getDay();var daysInMonth=new Date(year,month+1,0).getDate();
  var dayColors={push:"#d4ff00",pull:"#00e676",legs:"#00e5ff",upper:"#ff9100",lower:"#ff4500",cardio:"#555"};

  }

  var volTot=0,volBy={};

// ── EVOLUÇÃO ──
function rEvol(){
  var avalAll=AVAL_BASE.concat(DB.aval||[]);var last=avalAll.length?avalAll[avalAll.length-1]:null;var prev=avalAll.length>1?avalAll[avalAll.length-2]:null;
  function delta(a,b,key){var d=(a[key]-b[key]).toFixed(1);return d>0?"(+"+d+")":"("+d+")";}
  function dColor(a,b,key,inv){var d=a[key]-b[key];if(d===0)return"#555";return(d>0)!==inv?"#00e676":"#ff4500";}
  var ws=DB.weights;var wGraph="";
  if(ws.length>1){var vals=[],i;for(i=0;i<ws.length;i++)vals.push(ws[i].val);var mn=vals[0],mx=vals[0];for(i=1;i<vals.length;i++){if(vals[i]<mn)mn=vals[i];if(vals[i]>mx)mx=vals[i];}mn-=1;mx+=1;var W2=300,H2=55,xs=vals.length>1?W2/(vals.length-1):0,pts="",dots="";for(i=0;i<vals.length;i++){var x=i*xs,y=H2-((vals[i]-mn)/(mx-mn))*H2;pts+=(i?" ":"")+x+","+y;dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#d4ff00"/>';}wGraph='<div class="card cp" style="margin-bottom:10px"><div class="lbl" style="margin-bottom:7px">Peso Corporal (kg)</div><svg viewBox="0 0 300 55" style="width:100%;height:55px;display:block"><polyline points="'+pts+'" fill="none" stroke="#d4ff00" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg><div style="display:flex;justify-content:space-between;margin-top:3px"><span style="font-size:10px;color:#555">'+ws[0].date+'</span><span style="font-size:10px;color:#555">'+ws[ws.length-1].date+'</span></div></div>';}
  var mmGraph="";

function calcTargets(){
  var avalAll=AVAL_BASE.concat(DB.aval||[]);var last=avalAll.length?avalAll[avalAll.length-1]:null;
  var lwLog=DB.weights.length?DB.weights[DB.weights.length-1].val:null;var w=lwLog||(last?last.peso:80.4);
  // Mifflin-St Jeor x 1.5 (musculacao 5x/sem). A formula anterior (x1.725) superestimava o gasto.
  var tmb=Math.round(10*w+6.25*183-5*37+5);var tdee=Math.round(tmb*1.5);
  var goalMap={cut:{lbl:"Meta Corte (-500)",kcal:tdee-500,pro:2.2},manut:{lbl:"Meta Manutencao",kcal:tdee,pro:2.0},bulk:{lbl:"Meta Bulk (+300)",kcal:tdee+300,pro:1.8}};
  var gg=goalMap[DB.goal]||goalMap.cut;
  var p=Math.round(w*gg.pro),g=Math.round(w*0.8),c=Math.max(0,Math.round((gg.kcal-p*4-g*9)/4));
  return {w:w,logged:!!lwLog,tmb:tmb,tdee:tdee,gg:gg,kcal:gg.kcal,p:p,c:c,g:g};
}

  var TG=calcTargets(),FT=foodTotals(),day=dayFood(),slotNow=curSlot();
  function row(lbl,v,t,unit,color,goodOver){
    var pct=t>0?Math.min(100,Math.round(v/t*100)):0,over=v>t,left=Math.round(t-v);
    var col=over?(goodOver?"#00e676":"#ff4500"):(pct>=90?"#ff9100":color);

  }

  var remP=TG.p-FT.p,remC=TG.c-FT.c,remK=TG.kcal-FT.k,msgs=[];

  else{
    if(remK<0)msgs.push('<b style="color:#ff4500">Passou '+Math.round(-remK)+' kcal do alvo.</b> Segura a onda: nas proximas refeicoes so proteina magra e salada.');
    if(remP>5)msgs.push('Faltam <b style="color:#00e676">'+Math.round(remP)+'g de proteina</b>'+(remK>0?' (≈ '+Math.round(remP/32*100)+'g de frango grelhado, '+Math.round(remP/32*159)+' kcal)':'')+'.');
    else msgs.push('<b style="color:#00e676">Proteina do dia fechada ✓</b>');

    +row("Calorias",FT.k,TG.kcal," kcal","#f0f0f0",false)+row("Proteina",FT.p,TG.p,"g","#00e676",true)+row("Carbo",FT.c,TG.c,"g","#d4ff00",false)+row("Gordura",FT.g,TG.g,"g","#ff9100",false)
    +'<div style="font-size:12px;color:#aaa;line-height:1.7;margin-top:4px">'+msgs.join('<br>')+'</div></div>';

  for(var j=0;j<FOODCAT.length;j++)opts+='<option value="'+FOODCAT[j].id+'"'+(FOODCAT[j].id===fSel?" selected":"")+'>'+FOODCAT[j].n+'</option>';
  var qtyH;

    qtyH='<input type="text" id="fm_n" placeholder="Nome (ex: whey, banana)">'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px"><input type="number" inputmode="decimal" id="fm_k" placeholder="kcal" style="width:100%"><input type="number" inputmode="decimal" id="fm_p" placeholder="prot g" style="width:100%"><input type="number" inputmode="decimal" id="fm_c" placeholder="carbo g" style="width:100%"><input type="number" inputmode="decimal" id="fm_g" placeholder="gord g" style="width:100%"></div>';
  }else{
    qtyH='<div style="display:flex;align-items:center;gap:8px"><input type="number" inputmode="decimal" id="fq" value="'+fQty+'" oninput="fQty=this.value;foodPrev()" style="width:90px;font-size:16px;padding:8px"><span style="font-size:13px;color:#aaa">'+cat.ul+'</span></div>'
      +'<div id="fprev" style="font-size:12px;color:#00e5ff;margin-top:6px">'+(function(){var q=parseFloat(fQty)||0,m=foodMacros(cat,q);return "= "+Math.round(m.k)+" kcal · P "+Math.round(m.p)+"g · C "+Math.round(m.c)+"g · G "+Math.round(m.g)+"g";})()+'</div>';
  }
  var form='<div class="card cp" style="margin-bottom:12px"><div class="lbl" style="margin-bottom:6px">Registrar o que comi</div>'
    +'<div style="display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px">'+chips+'</div>'
    +'<select onchange="onFoodSel(this.value)">'+opts+'</select>'+qtyH
    +'<button onclick="addFood()" class="btn">Adicionar em '+(function(){for(var s=0;s<SLOTS.length;s++)if(SLOTS[s].id===slotNow)return SLOTS[s].n;return "";})()+'</button></div>';
  // refeicoes do dia
  var meals="";
  for(var si=0;si<SLOTS.length;si++){
    var S=SLOTS[si],ents=[];for(var ei=0;ei<day.length;ei++)if(day[ei].s===S.id)ents.push(day[ei]);
    if(S.id==="outro"&&!ents.length)continue;

  var tips='<div class="card cp" style="border-color:#ff9100;margin-bottom:10px"><div class="lbl" style="color:#ff9100;margin-bottom:6px">Como ajustar</div><div style="font-size:12px;color:#aaa;line-height:1.7">'
    +'• Meta: perder <b style="color:#f0f0f0">0,5 a 0,7kg por semana</b> (pese em jejum, compare a media da semana).<br>'

  return '<div class="pg"><div class="ttl" style="margin-bottom:3px">DIETA</div><div class="lbl" style="margin-bottom:12px">Corte simples · so alimentos que voce ja come</div>'

function rProfile(){
  var avalAll=AVAL_BASE.concat(DB.aval||[]);var last=avalAll.length?avalAll[avalAll.length-1]:null;var lwLog=DB.weights.length?DB.weights[DB.weights.length-1].val:null;var lW=lwLog||(last?last.peso:80.4);
  var TG=calcTargets();var tmb=TG.tmb,tdee=TG.tdee,gg=TG.gg;
  var allDone=[],k;for(k in DB.done){if(DB.done[k]){var parts=k.split("_");var date=parts[parts.length-1];var id=parts.slice(0,-1).join("_");var dd=getDay(id);allDone.push({label:dd?dd.label:id,date:date,isCardio:dd&&dd.isCardio,id:id});}}
  allDone.sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0;});
  var logH="";if(!allDone.length)logH='<div style="padding:12px 0;font-size:13px;color:#555">Nenhum treino registrado ainda.</div>';
  else for(var i=0;i<Math.min(allDone.length,40);i++){var x=allDone[i];logH+='<div class="row" onclick="showSession(\''+x.id+'\',\''+x.date+'\')" style="cursor:pointer"><span style="font-size:13px;font-weight:700;color:'+(x.isCardio?"#00e5ff":"#f0f0f0")+'">'+x.label+'</span><span style="font-size:12px;color:#00e676">'+x.date.slice(8)+"/"+x.date.slice(5,7)+"/"+x.date.slice(0,4)+' ›</span></div>';}
  function tr(k,v,hi){return '<div class="row"><span style="font-size:12px;color:#555">'+k+'</span><span style="font-size:14px;font-weight:700;color:'+(hi?"#d4ff00":"#f0f0f0")+'">'+v+'</span></div>';}
  return '<div class="pg"><div class="ttl" style="margin-bottom:14px">PERFIL</div>'
    +'<div class="lbl" style="margin-bottom:6px">Log de Treinos ('+allDone.length+')</div><div class="card" style="padding:0 12px;margin-bottom:12px">'+logH+'</div>'
    +'<div class="lbl" style="margin-bottom:6px">Periodizacao</div><div class="card" style="padding:0 12px;margin-bottom:12px">'+tr("Semana Atual","Sem "+DB.week+" · "+WC[(DB.week-1)%4].name,true)+tr("Ciclos Completos",DB.cycleCount,false)+tr("Proximo Ciclo",WC[DB.week%4].name,false)+'</div>'
    +'<div class="lbl" style="margin-bottom:6px">Biometria</div><div class="card" style="padding:0 12px;margin-bottom:12px">'+tr("Nome","Diego",true)+tr("Altura","1,83m",false)+tr("Idade","37 anos",false)+(last?tr("Ultimo Peso",last.peso+"kg",true)+tr("Gordura",last.gord+"%",false)+tr("Massa Muscular",last.mm+"kg",true)+tr("MLG",last.mlg+"kg",false):"")+'</div>'
    +'<div class="lbl" style="margin-bottom:6px">Nutricao · peso base '+lW+'kg</div>'
    +'<div class="card" style="padding:0 12px;margin-bottom:6px">'+tr("TMB",tmb+" kcal",false)+tr("TDEE (treino)",tdee+" kcal",true)+tr(gg.lbl,gg.kcal+" kcal",true)+tr("Proteina alvo",TG.p+"g/dia ("+gg.pro+"g/kg)",true)+tr("Carbo alvo",TG.c+"g/dia",false)+tr("Gordura alvo",TG.g+"g/dia",false)+tr("Agua","3,5L/dia",false)+'</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:12px">'
    +'<button onclick="setGoal(\'cut\')" class="tab-btn'+(DB.goal==="cut"?" on":"")+'" style="flex:1">Corte</button>'
    +'<button onclick="setGoal(\'manut\')" class="tab-btn'+(DB.goal==="manut"?" on":"")+'" style="flex:1">Manutencao</button>'
    +'<button onclick="setGoal(\'bulk\')" class="tab-btn'+(DB.goal==="bulk"?" on":"")+'" style="flex:1">Bulk</button>'
    +'</div>'
    +'<button onclick="doBackup()" class="btn btnd">Exportar Backup JSON</button>'
    +'<button onclick="doRestore()" class="btn btncyan" style="margin-top:6px">Importar Backup JSON</button>'
    +'<input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="handleRestore(this)">'
    +'<button onclick="if(confirm(\'Apagar TUDO?\')){{localStorage.removeItem(\''+SK+'\');location.reload();}}" class="btn btnr" style="margin-top:6px">Resetar dados</button>'
    +'<div style="text-align:center;font-size:10px;color:#444;margin-top:14px;word-break:break-all">Versao '+APP_VER+' · '+(typeof location!=="undefined"&&location.host?location.host:"local")+'</div></div>';
}

function setGoal(g){DB.goal=g;save();render();}
function doBackup(){
  try{var data=JSON.stringify(DB,null,2);var blob=new Blob([data],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="diego-training-"+tod()+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast("Backup exportado!");}catch(e){toast("Erro: "+e.message);}
}
function doRestore(){var inp=document.getElementById("restoreFile");if(inp){inp.value="";inp.click();}}
function handleRestore(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);if(!p||typeof p!=="object"||p.done===undefined&&p.sets===undefined)throw new Error("arquivo nao parece um backup");
      if(!confirm("Isso vai SUBSTITUIR todos os dados atuais pelos do backup. Continuar?")){inp.value="";return;}
      for(var i=0;i<KEYS.length;i++){if(p[KEYS[i]]!==undefined)DB[KEYS[i]]=p[KEYS[i]];}
      save();toast("Backup restaurado!");curDay="";go(0);
    }catch(e){toast("Erro: "+e.message);}
    inp.value="";
  };
  r.readAsText(f);
}

load();
if(!curDay)curDay=nextTrainingId();
render();
