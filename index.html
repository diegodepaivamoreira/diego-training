<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Training PRO</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
#app{max-width:500px;margin:auto}

.title{color:#d4ff00;font-size:28px;padding:20px;font-weight:bold}

.chips{display:flex;gap:10px;overflow:auto;padding:0 10px}
.chip{background:#222;padding:10px 14px;border-radius:20px}
.active{background:#d4ff00;color:#000}

.card{background:#111;margin:10px;padding:15px;border-radius:14px}

.exercise{margin-top:15px}
.tag{font-size:11px;background:#222;padding:4px 8px;border-radius:6px;margin-bottom:5px;display:inline-block}

.series{display:flex;gap:8px;margin-top:6px;align-items:center}

input{
  background:#000;border:1px solid #333;border-radius:8px;
  color:#fff;padding:6px;width:55px
}

.slabel{font-size:12px;color:#aaa;width:25px}

.check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #444;
}
.done{background:#00e676}

.btn{
  background:#d4ff00;color:#000;padding:14px;
  border:none;border-radius:10px;width:100%;margin-top:15px;font-weight:bold
}

.timer{
  font-size:50px;
  text-align:center;
  color:#d4ff00;
}

.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<div id="app">

<div class="title">DIEGO TRAINING</div>

<div class="chips" id="chips"></div>

<div class="card">
  <b>Peso:</b> 80.5kg<br>
  <b>IMC:</b> 24.0<br>
  <b>Treinos:</b> <span id="count">0</span>
</div>

<div id="treino"></div>

<div class="card">
  <div class="timer" id="timer">60</div>
</div>

</div>

<script>

// TREINOS COMPLETOS
const treinos = {

Peito:[
{tipo:"TRI-SET",exercicios:["Supino declinado","Cross over","Crucifixo declinado"],series:3},
{tipo:"TRI-SET",exercicios:["Supino reto","Supino máquina","Crucifixo máquina"],series:3},
{tipo:"TRI-SET",exercicios:["Supino 45","Supino 45 máquina","Crucifixo 45"],series:3}
],

Costas:[
{tipo:"TRI-SET",exercicios:["Barra fixa","Puxada hammer","Puxada frente"],series:3},
{tipo:"TRI-SET",exercicios:["Puxada por trás","Puxada articulada","Puxada frente"],series:3},
{tipo:"TRI-SET",exercicios:["Remada inclinada","Remada unilateral","Remada sentada"],series:3}
],

Ombros:[
{tipo:"TRI-SET",exercicios:["Abdução","Cross posterior","Abdução cotovelo"],series:3},
{tipo:"TRI-SET",exercicios:["Desenvolvimento máquina","Elevação frontal","Cross frontal"],series:3},
{tipo:"BI-SET",exercicios:["Desenvolvimento smith","Crucifixo inverso"],series:3},
{tipo:"TRI-SET",exercicios:["Encolhimento","Remada alta","Encolhimento máquina"],series:3}
],

Bracos:[
{tipo:"TRI-SET",exercicios:["Rosca direta","Rosca Scott","Rosca alternada"],series:3},
{tipo:"TRI-SET",exercicios:["Tríceps testa","Tríceps pulley","Tríceps corda"],series:3},
{tipo:"ISOLADO",exercicios:["Rosca martelo"],series:3}
],

Anterior:[
{tipo:"SEQUÊNCIA",exercicios:["Agachamento","Leg press","Extensora","Adutora"],series:3}
],

Posterior:[
{tipo:"SEQUÊNCIA",exercicios:["Flexora","Stiff","Panturrilha"],series:4}
]

};

let atual="";
let dados = JSON.parse(localStorage.getItem("dados")||"{}");

// CHIPS
function init(){
  let html="";
  Object.keys(treinos).forEach(nome=>{
    html+=`<div class="chip" onclick="abrir('${nome}',this)">${nome}</div>`;
  });
  document.getElementById("chips").innerHTML=html;
  atualizarContador();
}

function abrir(nome,el){
  atual=nome;

  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");

  render();
}

// RENDER
function render(){
  let treino = treinos[atual];
  if(!treino) return;

  let html=`<div class="card"><h2>${atual}</h2>`;

  treino.forEach((bloco,b)=>{

    html+=`
    <div class="exercise">
      <div class="tag">${bloco.tipo}</div>

      ${bloco.exercicios.map(e=>`
        <div>
          ${e}
          ${sugestao(e)}
        </div>
      `).join("")}

      ${renderSeries(b,bloco.series)}
    </div>
    `;
  });

  html+=`<button class="btn" onclick="finalizar()">Finalizar treino</button></div>`;

  document.getElementById("treino").innerHTML = html;
}

// SUGESTÃO DE CARGA
function sugestao(nome){
  let hist = JSON.parse(localStorage.getItem("cargas")||"{}");

  if(hist[nome]){
    return `<div class="small">Sugestão: ${hist[nome]+2}kg</div>`;
  }

  return "";
}

// SERIES
function renderSeries(b,total){

  let html="";

  for(let s=0;s<total;s++){

    let val = dados[atual]?.[b]?.[s] || {};

    html+=`
    <div class="series">
      <div class="slabel">S${s+1}</div>

      <input placeholder="kg" value="${val.kg||""}"
      oninput="save(${b},${s},'kg',this.value)">

      <input placeholder="rep" value="${val.rep||""}"
      oninput="save(${b},${s},'rep',this.value)">

      <div class="check ${val.done?'done':''}"
      onclick="toggle(${b},${s})"></div>
    </div>
    `;
  }

  return html;
}

// SAVE
function save(b,s,key,val){
  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][b]) dados[atual][b]={};
  if(!dados[atual][b][s]) dados[atual][b][s]={};

  dados[atual][b][s][key]=val;

  localStorage.setItem("dados",JSON.stringify(dados));
}

// CHECK + TIMER
function toggle(b,s){

  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][b]) dados[atual][b]={};
  if(!dados[atual][b][s]) dados[atual][b][s]={};

  dados[atual][b][s].done = !dados[atual][b][s].done;

  localStorage.setItem("dados",JSON.stringify(dados));

  startTimer();
  render();
}

// FINALIZAR
function finalizar(){

  salvarCargas();

  let hist = JSON.parse(localStorage.getItem("hist")||"[]");
  hist.push({treino:atual,data:new Date().toLocaleString()});
  localStorage.setItem("hist",JSON.stringify(hist));

  atualizarContador();

  alert("Treino salvo 🔥");
}

// SALVAR CARGAS
function salvarCargas(){
  let cargas = JSON.parse(localStorage.getItem("cargas")||"{}");

  treinos[atual].forEach((bloco,b)=>{
    bloco.exercicios.forEach(nome=>{
      let kg = dados[atual]?.[b]?.[0]?.kg;
      if(kg) cargas[nome]=Number(kg);
    });
  });

  localStorage.setItem("cargas",JSON.stringify(cargas));
}

// CONTADOR
function atualizarContador(){
  let hist = JSON.parse(localStorage.getItem("hist")||"[]");
  document.getElementById("count").innerText = hist.length;
}

// TIMER
let tempo=60, int;

function startTimer(){
  clearInterval(int);
  tempo=60;

  int=setInterval(()=>{
    tempo--;
    document.getElementById("timer").innerText=tempo;
    if(tempo<=0) clearInterval(int);
  },1000);
}

// INIT
init();

</script>

</body>
</html>
