<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="theme-color" content="#080808"/>
<title>Diego Training</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#080808;color:#f0f0f0;font-family:'DM Sans',sans-serif;overflow:hidden;}
#wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#080808;}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
nav{flex-shrink:0;display:flex;background:#111;border-top:1px solid #282828;padding-bottom:env(safe-area-inset-bottom,0);}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;border:none;background:none;color:#555;cursor:pointer;font-size:10px;font-weight:500;font-family:'DM Sans',sans-serif;}
nav button.active{color:#d4ff00;}
nav svg{width:20px;height:20px;flex-shrink:0;}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.bebas{font-family:'Bebas Neue',cursive;}
.card{background:#111;border:1px solid #282828;border-radius:12px;}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#555;font-weight:600;}
/* timer */
#timer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
#timer.on{display:flex;}
/* toast */
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#00e676;color:#000;padding:9px 22px;border-radius:20px;font-weight:700;font-size:13px;z-index:1000;display:none;white-space:nowrap;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="content"></div>
  <nav>
    <button class="active" id="nb-dash" onclick="goTab('dash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Início
    </button>
    <button id="nb-treino" onclick="goTab('treino')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>Treino
    </button>
    <button id="nb-period" onclick="goTab('period')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Ciclo
    </button>
    <button id="nb-evol" onclick="goTab('evol')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Evolução
    </button>
    <button id="nb-profile" onclick="goTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Perfil
    </button>
  </nav>
</div>

<!-- Timer overlay -->

<div id="timer">
  <div class="lbl" style="margin-bottom:16px">Descanso</div>
  <div style="position:relative;width:190px;height:190px;margin-bottom:18px">
    <svg width="190" height="190" viewBox="0 0 190 190" style="transform:rotate(-90deg)">
      <circle cx="95" cy="95" r="83" fill="none" stroke="#222" stroke-width="8"/>
      <circle id="tarc" cx="95" cy="95" r="83" fill="none" stroke="#d4ff00" stroke-width="8" stroke-linecap="round" stroke-dasharray="521" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear,stroke .3s"/>
    </svg>
    <div id="tnum" class="bebas" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:72px;letter-spacing:4px;line-height:1;color:#f0f0f0"></div>
  </div>
  <div id="tgo" class="bebas" style="font-size:28px;letter-spacing:4px;color:#d4ff00;min-height:36px;margin-bottom:8px"></div>
  <div id="tnext" style="font-size:12px;color:#555;text-align:center;max-width:260px;line-height:1.5;padding:0 20px;min-height:40px"></div>
  <div style="display:flex;align-items:center;gap:16px;margin-top:16px">
    <button onclick="tadj(-15)" style="background:#1a1a1a;color:#aaa;border:1px solid #282828;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer;font-family:'DM Sans',sans-serif">−</button>
    <span id="ttot" style="font-size:13px;color:#555;min-width:48px;text-align:center;font-weight:600"></span>
    <button onclick="tadj(15)" style="background:#1a1a1a;color:#aaa;border:1px solid #282828;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer;font-family:'DM Sans',sans-serif">+</button>
  </div>
  <div style="display:flex;gap:12px;margin-top:22px">
    <button onclick="closeTimer()" style="background:#1a1a1a;color:#f0f0f0;border:1px solid #282828;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Pular ▶</button>
    <button onclick="closeTimer()" style="background:none;color:#555;border:1px solid #282828;border-radius:12px;padding:12px 28px;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif">Cancelar</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ── DADOS ──
const WC=[
  {num:1,name:"Volume Base",desc:"Volume total e conexão neuromuscular. Carga moderada-alta, execução impecável.",series:3,reps:"10",rest:60,drop:false},
  {num:2,name:"Sobrecarga Progressiva",desc:"Carga 10-15% maior. Menos reps, mais intensidade. Recrutamento máximo.",series:4,reps:"8",rest:75,drop:false},
  {num:3,name:"Choque Metabólico",desc:"Rep range alto, descanso curto, drop-set na última série de cada tri-set.",series:3,reps:"12-15",rest:45,drop:true},
  {num:4,name:"Deload Ativo",desc:"Volume e carga reduzidos. Foco em execução, amplitude e recuperação tecidual.",series:2,reps:"10",rest:60,drop:false},
];
const DAYS=[
  {id:"peito",label:"PEITO",short:"Pei",wd:"Seg",sub:"Peitoral · Tri-sets",trisets:[
    {label:"Tri-set 1",ex:[{n:"Supino Declinado HBL",t:"Cotovelos 45° do tronco. Desça até sentir o peitoral inferior abrir."},{n:"Cross Over",t:"Adução completa, cruzando levemente na frente. Tensão constante."},{n:"Crucifixo Declinado HBC",t:"Leve flexão de cotovelo fixa durante todo o movimento."}]},
    {label:"Tri-set 2",ex:[{n:"Supino Reto HBL",t:"Barra desce até 1cm do esterno. Arco controlado."},{n:"Supino Reto HBC",t:"Rotação supinada no topo para máximo pico."},{n:"Crucifixo Máquina",t:"Tensão constante durante toda a amplitude."}]},
    {label:"Tri-set 3",ex:[{n:"Supino 45° HBL",t:"Enfatiza porção clavicular. Cotovelos ligeiramente fechados."},{n:"Supino 45° HBC",t:"Amplitude máxima. Sinta o peitoral superior na descida."},{n:"Crucifixo 45° HBC",t:"Não deixe os halteres se tocarem no topo."}]},
  ]},
  {id:"costas",label:"COSTAS",short:"Cos",wd:"Ter",sub:"Costas · Tri-sets",trisets:[
    {label:"Tri-set 1",ex:[{n:"Barra Fixa pela Frente",t:"Pegada pronada, mais larga que o ombro. Cotovelo aponta para o chão."},{n:"Puxada Rammer",t:"Neutro ou supinado. Enfatiza dorsal inferior e bíceps."},{n:"Puxada pela Frente PP",t:"Pegada paralela. Feche as escápulas no final."}]},
    {label:"Tri-set 2",ex:[{n:"Puxada por Trás",t:"Pescoço neutro. Barra desce até a nuca. Escápulas retraídas."},{n:"Puxada Articulada",t:"Maior rotação escapular. Ótima para espessura."},{n:"Puxada pela Frente PP",t:"Finaliza com pump máximo em polia leve."}]},
    {label:"Tri-set 3",ex:[{n:"Remada Inclinada PP",t:"45°. Cotovelo próximo ao corpo, puxe para o quadril."},{n:"Remada Unilateral HBC",t:"Apoia o joelho. Puxe cotovelo para cima e trás."},{n:"Remada Sentada PN",t:"Polia baixa, pegada neutra. Tronco levemente reclinado no topo."}]},
  ]},
  {id:"anterior",label:"ANTERIOR",short:"Ant",wd:"Qua",sub:"Quadríceps · Adutora · Core",trisets:[
    {label:"Série · Quadríceps",single:true,ex:[
      {n:"Agachamento no Smith",t:"Pés à frente. Desce até 90°. Joelho alinhado com o pé."},
      {n:"Leg Press 45",t:"Larga e alta para glúteo. Estreita e baixa para quad isolado."},
      {n:"Leg Houst",t:"Maior amplitude de joelho. Excelente para VMO."},
      {n:"Cadeira Extensora",t:"Cadência lenta na descida (3s). Pausa 1s no topo."},
      {n:"Agachamento Unilateral no Smith",t:"Avança o pé. Isola quad e glúteo unilateralmente."},
      {n:"Cadeira Adutora",t:"Controle a volta. Pressão constante dos 10° aos 90°."},
    ]},
    {label:"Core",single:true,ex:[{n:"Abdominal Lateral na Prancha",t:"Quadril neutro. 30-45s por lado."}]},
  ]},
  {id:"ombros",label:"OMBROS",short:"Omb",wd:"Qui",sub:"Ombros · Tri-sets",trisets:[
    {label:"Tri-set 1 · Lateral",ex:[{n:"Abdução de Ombro Sentado HBC",t:"Polegar levemente para baixo. Até 90°, não ultrapasse."},{n:"Abdução por Trás no Cross Unilateral",t:"Polia baixa passando atrás. Isola cabeça lateral."},{n:"Abdução (cotovelos dobrados) HBC",t:"Cotovelo a 90°. Movimento mais curto e concentrado."}]},
    {label:"Tri-set 2 · Frontal",ex:[{n:"Desenvolvimento Máquina",t:"Cadência 2-1-2. Não trave o cotovelo no topo."},{n:"Flexão de Ombro HBC PN",t:"Braço reto, até a linha dos olhos. Controla a descida."},{n:"Flexão de Ombro no Cross PP",t:"Polia baixa. Contração máxima no topo com pausa de 1s."}]},
    {label:"Tri-set 3 · Posterior",ex:[{n:"Desenvolvimento por Trás no Smith",t:"Barra desce até as orelhas. Pescoço neutro."},{n:"Crucifixo Inverso Máquina",t:"Peito no apoio. Braços até paralelo ao solo."}]},
    {label:"Tri-set 4 · Trapézio",ex:[{n:"Encolhimento de Ombro HBC",t:"Sobe direto, sem rotação. Segura 1s no topo."},{n:"Remada Alta no Cross",t:"Pegada fechada, puxe até o queixo. Cotovelos acima dos ombros."},{n:"Encolhimento de Ombro HBM",t:"Haltere permite amplitude maior."}]},
  ]},
  {id:"biceps",label:"BÍC/TRIC",short:"BT",wd:"Sex",sub:"Bíceps e Tríceps",trisets:[
    {label:"Tri-set Bíceps",ex:[{n:"Rosca Direta HBM",t:"Supinação completa. Cotovelo fixo. Não jogue o tronco."},{n:"Rosca Scott Máquina",t:"Isola o bíceps. Cadência lenta. Não trave no topo."},{n:"Rosca Alternada HBC",t:"Rotação do punho na subida. Plena amplitude."}]},
    {label:"Tri-set Tríceps",ex:[{n:"Tríceps na Testa HBW",t:"Barra desce até testa. Cotovelos fixos apontados para cima."},{n:"Tríceps no Pulley PP",t:"Cotovelo fixo ao lado. Extensão completa no final."},{n:"Tríceps no Cross c/ Corda",t:"Separa a corda no final para máxima contração das 3 cabeças."}]},
    {label:"Isolado",single:true,ex:[{n:"Rosca Punho Martelo",t:"Trabalha braquial e braquiorradial. 3x15 controlado."}]},
  ]},
  {id:"posterior",label:"POSTERIOR",short:"Pos",wd:"Sáb",sub:"Posterior · Panturrilha · Core",trisets:[
    {label:"Série · Isquiotibiais",single:true,ex:[
      {n:"Cadeira Flexora",t:"Senta bem no fundo. Quadril fixo. Contrai glúteo no final."},
      {n:"Cadeira Abdutora",t:"Controle a volta. Não deixe as placas se tocarem."},
      {n:"Mesa Flexora",t:"Quadril encaixado. Não levante o quadril na subida."},
      {n:"Stiff",t:"Joelho levemente flexionado. Sente o alongamento. Tronco neutro."},
      {n:"Flexão de Joelho em Pé Maq.",t:"Isola isquio de forma diferente."},
      {n:"A Fundo no Banco",t:"Pé elevado atrás. Desce o joelho ao chão. Glúteo + isquio."},
    ]},
    {label:"Panturrilha + Core",single:true,ex:[{n:"Panturrilha em Pé",t:"5x20. Amplitude máxima. Pausa 1s no alto e 1s no baixo."},{n:"Abd. Infra no Suporte",t:"Joelhos dobrados, sobe até o quadril. Não balance o tronco."}]},
  ]},
  {id:"cardio",label:"CARDIO",short:"Dom",wd:"Dom",sub:"Cardio + Abdome",isRest:true,trisets:[
    {label:"Cardio",single:true,ex:[{n:"Escada ou Esteira Inclinada",t:"30-40 min. Zona 2: falar frases completas. FC alvo 120-140 bpm."}]},
    {label:"Abdome Completo",single:true,ex:[
      {n:"Abdominal Supra",t:"3x20. Contração concentrada. Não trave a respiração."},
      {n:"Elevação de Pernas",t:"3x15. Lombar colada no chão. Desce lentamente."},
      {n:"Prancha Frontal",t:"3x45s. Quadril neutro. Respira normalmente."},
      {n:"Abdominal Oblíquo / Bicicleta",t:"3x20 alternados. Rotação real do tronco."},
      {n:"Hollow Body Hold",t:"2x30s. Lombar no chão, braços e pernas levemente elevados."},
    ]},
  ]},
];

// ── STATE ──
const SK="dtv2";
let DB={week:1,sets:{},done:{},obs:{},weights:[],selEx:""};
let tab="dash";
let dayIdx=0;
let tInterval=null,tRem=0,tTot=0,tNext="";

function load(){try{const s=localStorage.getItem(SK);if(s)DB=Object.assign({week:1,sets:{},done:{},obs:{},weights:[],selEx:""},JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function wk(){return WC[(DB.week-1)%4];}
function today(){return new Date().toISOString().slice(0,10);}
function doneKey(id){return id+"_"+today();}
function isDone(id){return !!DB.done[doneKey(id)];}
function lastDone(id){
  const p=id+"_";
  const ds=Object.keys(DB.done).filter(k=>k.startsWith(p)&&DB.done[k]).map(k=>k.slice(p.length)).sort().reverse();
  return ds[0]||null;
}
function sk(d,ti,ei,si){return [d,ti,ei,si].join("_");}
function getS(d,ti,ei,si){return DB.sets[sk(d,ti,ei,si)]||{kg:"",reps:"",done:false};}
function setS(d,ti,ei,si,f,v){const k=sk(d,ti,ei,si);DB.sets[k]=Object.assign({kg:"",reps:"",done:false},DB.sets[k]||{},{[f]:v});save();}
function nSets(ts){return ts.single?3:wk().series;}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2500);
}

// ── TIMER ──
function startTimer(next){
  clearInterval(tInterval);
  tTot=wk().rest;tRem=tTot;tNext=next||"";
  const ov=document.getElementById("timer");
  ov.classList.add("on");
  document.getElementById("tgo").textContent="";
  updateT();
  tInterval=setInterval(()=>{
    tRem--;updateT();
    if(tRem<=0){
      clearInterval(tInterval);
      document.getElementById("tgo").textContent="VÁ!";
      try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300]);}catch(e){}
      beep();
      setTimeout(closeTimer,2200);
    }
  },1000);
}
function updateT(){
  document.getElementById("tnum").textContent=tRem;
  document.getElementById("tarc").style.strokeDashoffset=521*(1-tRem/tTot);
  document.getElementById("tarc").style.stroke=tRem<=10?"#ff4500":"#d4ff00";
  document.getElementById("ttot").textContent=tTot+"s";
  document.getElementById("tnext").textContent=tNext?"A seguir: "+tNext:"";
}
function tadj(d){tTot=Math.min(300,Math.max(15,tTot+d));tRem=Math.max(1,tRem+d);updateT();}
function closeTimer(){clearInterval(tInterval);document.getElementById("timer").classList.remove("on");}
function beep(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();
    [[0,880],[0.2,1100],[0.4,880]].forEach(([t,f])=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);o.frequency.value=f;
      g.gain.setValueAtTime(0.4,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.15);
      o.start(c.currentTime+t);o.stop(c.currentTime+t+0.16);
    });
  }catch(e){}
}

// ── NAV ──
function goTab(t){
  tab=t;
  ["dash","treino","period","evol","profile"].forEach(x=>{
    document.getElementById("nb-"+x).className=x===t?"active":"";
  });
  render();
  document.getElementById("content").scrollTop=0;
}
function goDay(i){dayIdx=i;goTab("treino");}

// ── RENDER ──
function render(){
  const c=document.getElementById("content");
  if(tab==="dash")c.innerHTML=renderDash();
  else if(tab==="treino")c.innerHTML=renderTreino();
  else if(tab==="period")c.innerHTML=renderPeriod();
  else if(tab==="evol")c.innerHTML=renderEvol();
  else if(tab==="profile")c.innerHTML=renderProfile();
}

function logo(){
  return `<svg width="48" height="48" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="120" height="120" rx="24" fill="#0a0a0a"/>

<path d="M58 66 Q60 62 62 66" stroke="#d4ff00" stroke-width="1.8" stroke-linecap="round"/>
<path d="M56 78 Q60 75 64 78" stroke="#d4ff00" stroke-width="1.8" stroke-linecap="round"/>
<rect x="54" y="86" width="12" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="54" y="97" width="12" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="54" y="108" width="12" height="8" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="41" y="86" width="11" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="40" y="97" width="11" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="41" y="108" width="11" height="8" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="68" y="86" width="11" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="69" y="97" width="11" height="9" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<rect x="68" y="108" width="11" height="8" rx="2.5" stroke="#d4ff00" stroke-width="1.8"/>
<path d="M25 77 Q21 84 22 93 Q23 100 27 104" stroke="#d4ff00" stroke-width="2.2" stroke-linecap="round"/>
<path d="M95 77 Q99 84 98 93 Q97 100 93 104" stroke="#d4ff00" stroke-width="2.2" stroke-linecap="round"/>
</svg>`;
}

function renderDash(){
  const jd=new Date().getDay();
  const dm={1:0,2:1,3:2,4:3,5:4,6:5,0:6};
  const ti=dm[jd]??0;
  const day=DAYS[ti];
  const done=isDone(day.id);
  const lW=DB.weights.length?DB.weights[DB.weights.length-1].val:null;
  const pW=DB.weights.length>1?DB.weights[DB.weights.length-2].val:null;
  const wd=lW&&pW?(lW-pW).toFixed(1):null;
  const W=wk();

  const chips=DAYS.map((d,i)=>{
    const dd=isDone(d.id),it=i===ti,ld=lastDone(d.id);
    const dateStr=ld?ld.slice(8)+"/"+ld.slice(5,7):d.wd;
    return `<div onclick="goDay(${i})" style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;border:1.5px solid ${it?"#d4ff00":dd?"#00e676":"#282828"};background:${dd?"#0a1a0a":"#111"};min-width:46px;cursor:pointer">
      <span style="font-size:9px;color:${it?"#d4ff00":dd?"#00e676":"#555"};font-weight:700;text-transform:uppercase">${d.short}</span>
      <div style="width:7px;height:7px;border-radius:50%;background:${dd?"#00e676":it?"#d4ff00":"#333"}"></div>
      <span style="font-size:8px;color:${dd?"#00e676":"#555"};text-align:center">${dateStr}</span>
    </div>`;
  }).join("");

  return `<div style="padding:20px 16px 16px;background:linear-gradient(160deg,#0f1a00,#080808 70%)">
    <div style="display:flex;align-items:center;gap:12px">${logo()}
      <div>
        <div class="bebas" style="font-size:26px;letter-spacing:4px;color:#d4ff00;line-height:1.1">DIEGO<br>TRAINING</div>
        <div class="lbl" style="margin-top:3px">Semana ${DB.week} · ${W.name}</div>
      </div>
    </div>
  </div>
  <div style="padding:12px 16px 0">
    <div class="lbl" style="margin-bottom:8px">Histórico</div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">${chips}</div>
  </div>
  <div style="padding:12px 16px 80px">
    <div class="card" style="border-color:${done?"#00e676":"#282828"};margin-bottom:12px">

        <div>
          <div class="lbl">Hoje · ${day.wd}</div>

      <div style="padding:12px 14px 14px">

        {l:"Descanso",v:W.rest+"s",d:W.name,dc:"#555"},
        {l:"IMC",v:lW?(lW/(1.83**2)).toFixed(1):"--",d:"1,83m · 37a",dc:"#555"},
        {l:"Semana",v:DB.week,d:W.name,dc:"#d4ff00"},
      ].map(m=>`<div class="card" style="padding:12px">
        <div class="lbl" style="margin-bottom:5px">${m.l}</div>

}

function renderTreino(){
  const day=DAYS[dayIdx];
  const W=wk();
  const done=isDone(day.id);
  const ld=lastDone(day.id);

  const tabs=DAYS.map((d,i)=>{
    const dd=isDone(d.id);
    return `<button onclick="dayIdx=${i};render()" style="flex-shrink:0;padding:5px 11px;border-radius:20px;border:1px solid ${i===dayIdx?"#d4ff00":dd?"#00e676":"#282828"};background:${i===dayIdx?"#d4ff00":"transparent"};color:${i===dayIdx?"#000":dd?"#00e676":"#555"};font-size:12px;font-weight:${i===dayIdx?700:500};cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif">${d.short}${dd?" ✓":""}</button>`;
  }).join("");

  const lastB=ld?`<div style="display:inline-flex;align-items:center;gap:6px;background:#0a1a0a;border:1px solid #00e676;border-radius:20px;padding:4px 12px;font-size:11px;color:#00e676;margin-bottom:12px">✓ Último: ${ld.slice(8)}/${ld.slice(5,7)}/${ld.slice(0,4)}</div>`:"";

  let body="";
  day.trisets.forEach((ts,ti)=>{
    const badge=ts.single?"SÉRIE":day.isRest?"CARDIO":"TRI-SET";
    const bbg=ts.single?"#1a1a1a":day.isRest?"#00e5ff":"#d4ff00";
    const btc=ts.single?"#555":"#000";
    let exH="";
    ts.ex.forEach((ex,ei)=>{
      const n=nSets(ts);
      const drop=W.drop&&!ts.single&&ei===ts.ex.length-1;
      let nx="";
      if(ei+1<ts.ex.length)nx=ts.ex[ei+1].n;
      else if(ti+1<day.trisets.length)nx=day.trisets[ti+1].ex[0]?.n||"";
      let sH="";
      for(let s=0;s<n;s++){
        const sv=getS(day.id,ti,ei,s);
        const nxE=nx.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
        sH+=`<div style="background:#1a1a1a;border:1px solid ${sv.done?"#00e676":"#282828"};border-radius:8px;padding:5px 6px;display:flex;align-items:center;gap:4px;min-width:88px">
          <span style="font-size:9px;color:#555;font-weight:700;min-width:14px">S${s+1}</span>
          <input type="number" inputmode="decimal" placeholder="kg" value="${sv.kg||""}"
            onchange="setS('${day.id}',${ti},${ei},${s},'kg',this.value)"
            style="width:38px;background:#080808;border:1px solid #282828;border-radius:5px;color:#f0f0f0;font-size:12px;font-weight:700;text-align:center;padding:3px 1px"/>
          <span style="font-size:9px;color:#333">×</span>
          <input type="number" inputmode="numeric" placeholder="rep" value="${sv.reps||""}"
            onchange="setS('${day.id}',${ti},${ei},${s},'reps',this.value)"
            style="width:38px;background:#080808;border:1px solid #282828;border-radius:5px;color:#f0f0f0;font-size:12px;font-weight:700;text-align:center;padding:3px 1px"/>
          <button onclick="toggleSet('${day.id}',${ti},${ei},${s},'${nxE}')"
            style="width:22px;height:22px;border-radius:50%;border:2px solid ${sv.done?"#00e676":"#282828"};background:${sv.done?"#00e676":"transparent"};cursor:pointer;color:${sv.done?"#000":"transparent"};font-size:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center">✓</button>
        </div>`;
      }
      exH+=`<div style="padding:8px 0;border-bottom:${ei<ts.ex.length-1?"1px solid #1a1a1a":"none"}">
        <div style="font-size:14px;font-weight:600;color:#f0f0f0;margin-bottom:5px">${ex.n}</div>
        ${ex.t?`<div style="font-size:11px;color:#00e5ff;margin-bottom:7px;font-style:italic;line-height:1.4">💡 ${ex.t}</div>`:""}
        ${drop?`<div style="display:inline-block;background:#1a0800;border:1px solid #ff4500;color:#ff4500;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-bottom:6px">DROP-SET NA ÚLTIMA SÉRIE</div>`:""}
        <div style="display:flex;gap:5px;flex-wrap:wrap">${sH}</div>
      </div>`;
    });
    body+=`<div class="card" style="margin-bottom:10px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:#181818;border-bottom:1px solid #282828">
        <span style="background:${bbg};color:${btc};font-family:'Bebas Neue',cursive;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:4px;border:${ts.single?"1px solid #282828":"none"}">${badge}</span>
        <span style="font-size:11px;font-weight:600;color:#555;flex:1;text-transform:uppercase;letter-spacing:.5px">${ts.label}</span>
        ${!ts.single?`<span style="font-size:11px;color:#d4ff00;font-weight:700">${W.series}×${W.reps}</span>`:""}
      </div>
      <div style="padding:6px 12px 10px">${exH}</div>
    </div>`;
  });

  return `<div style="padding:14px 16px 10px;background:#080808;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="bebas" style="font-size:28px;letter-spacing:2px;color:#d4ff00">${day.label}</div>
      <div style="font-size:11px;color:#555;text-align:right;line-height:1.6"><strong style="color:#aaa">Sem ${W.num} · ${W.name}</strong><br>${W.series}×${W.reps} · ${W.rest}s</div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">${tabs}</div>
  </div>
  <div style="padding:14px 16px 80px">
    ${lastB}
    <div class="card" style="padding:10px 12px;margin-bottom:12px;display:flex;gap:12px;align-items:center">
      ${[{v:W.series,l:"Séries"},{v:W.reps,l:"Reps"},{v:W.rest+"s",l:"Desc."}].map((p,i)=>`${i?'<div style="width:1px;height:28px;background:#282828"></div>':""}<div style="display:flex;flex-direction:column;align-items:center;gap:1px"><div class="bebas" style="font-size:20px;color:#d4ff00;line-height:1">${p.v}</div><div class="lbl">${p.l}</div></div>`).join("")}
      <div style="width:1px;height:28px;background:#282828"></div>
      <div style="flex:1;font-size:12px;color:#aaa"><strong style="color:#f0f0f0;font-size:13px;display:block">${W.name}</strong>${W.drop?'<span style="color:#ff4500;font-size:11px">Drop-set ativo</span>':""}</div>
    </div>
    ${body}
    <div style="margin-top:14px">
      <div class="lbl" style="margin-bottom:6px">Observações</div>
      <textarea onchange="DB.obs['${day.id}']=this.value;save()" placeholder="Cargas, sensações, PR..."
        style="width:100%;background:#111;border:1px solid #282828;border-radius:10px;color:#f0f0f0;font-size:13px;padding:10px;resize:none;min-height:68px;font-family:'DM Sans',sans-serif">${DB.obs[day.id]||""}</textarea>

```
</div>
<div style="margin-top:12px">
  <button onclick="toggleDone('${day.id}')" style="width:100%;background:${done?"#00e676":"#d4ff00"};color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">
    ${done?"✓ Concluído — toque para desfazer":"Marcar como Concluído"}
  </button>
</div>
```

  </div>`;
}

function toggleSet(d,ti,ei,si,nx){
const sv=getS(d,ti,ei,si);
const nv=!sv.done;
setS(d,ti,ei,si,“done”,nv);
if(nv)startTimer(nx);
render();
}
function toggleDone(id){
const nv=!isDone(id);
DB.done[doneKey(id)]=nv;
save();
if(nv)toast(“Treino concluído! 💪 Salvo.”);
render();
}

function renderPeriod(){
const cur=WC[(DB.week-1)%4];
const cards=WC.map(wk=>{
const ic=wk.num===cur.num;
return `<div class="card" style="border-color:${ic?"#d4ff00":"#282828"};margin-bottom:10px;overflow:hidden"> <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#181818"> <span class="bebas" style="font-size:13px;letter-spacing:1px;color:${ic?"#d4ff00":"#555"}">SEMANA ${wk.num}</span> <span style="font-size:14px;font-weight:700;color:${ic?"#d4ff00":"#f0f0f0"};flex:1">${wk.name}</span> ${ic?`<span style="background:#d4ff00;color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">ATUAL</span>`:""} </div> <div style="padding:10px 12px"> <p style="font-size:13px;color:#aaa;line-height:1.6;margin-bottom:8px">${wk.desc}</p> <div style="display:flex;gap:8px;flex-wrap:wrap"> ${[{v:wk.series,l:"Séries"},{v:wk.reps,l:"Reps"},{v:wk.rest+"s",l:"Descanso"},{v:wk.drop?"SIM":"NÃO",l:"Drop-set"}].map(p=>`<div style="background:#202020;border:1px solid #282828;border-radius:6px;padding:5px 9px;text-align:center"><div class="bebas" style="font-size:17px;color:#d4ff00;line-height:1">${p.v}</div><div class="lbl">${p.l}</div></div>`).join("")} </div> </div> </div>`;
}).join(””);
return `<div style="padding:16px 16px 80px">
<div class="bebas" style="font-size:30px;letter-spacing:3px;color:#d4ff00;margin-bottom:2px">CICLO</div>
<div style="font-size:12px;color:#555;margin-bottom:16px">Periodização 4 semanas</div>
${cards}
<div style="margin-top:16px">
<div class="lbl" style="margin-bottom:8px">Semana do Programa</div>
<div style="display:flex;gap:8px;align-items:center">
<button onclick="DB.week=Math.max(1,DB.week-1);save();render()" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#f0f0f0;width:44px;height:44px;font-size:20px;cursor:pointer;font-family:'DM Sans',sans-serif">−</button>
<div class="bebas" style="flex:1;background:#111;border:1px solid #282828;border-radius:8px;padding:10px;text-align:center;font-size:22px;letter-spacing:2px;color:#d4ff00">SEMANA ${DB.week}</div>
<button onclick="DB.week++;save();toast('Semana '+DB.week+' · '+WC[(DB.week-1)%4].name);render()" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#f0f0f0;width:44px;height:44px;font-size:20px;cursor:pointer;font-family:'DM Sans',sans-serif">+</button>
</div>
</div>

  </div>`;
}

function renderEvol(){
const ws=DB.weights;
const lW=ws.length?ws[ws.length-1].val:null;
let graph=””;
if(ws.length>1){
const vals=ws.map(x=>x.val),mn=Math.min(…vals)-1,mx=Math.max(…vals)+1;
const W=300,H=65,xs=W/(vals.length-1);
const pts=vals.map((v,i)=>`${i*xs},${H-((v-mn)/(mx-mn))*H}`).join(” “);
graph=`<div class="card" style="padding:12px;margin-bottom:12px"> <div class="lbl" style="margin-bottom:10px">Peso Corporal (kg)</div> <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:65px;display:block"> <polyline points="${pts}" fill="none" stroke="#d4ff00" stroke-width="2.5" stroke-linejoin="round"/> ${vals.map((v,i)=>`<circle cx="${i*xs}" cy="${H-((v-mn)/(mx-mn))*H}" r="3.5" fill="#d4ff00"/>`).join("")} </svg> <div style="display:flex;justify-content:space-between;margin-top:4px"> <span style="font-size:10px;color:#555">${ws[0].date}</span> <span style="font-size:10px;color:#555">${ws[ws.length-1].date}</span> </div> </div>`;
}
const allEx=[];
DAYS.forEach(d=>d.trisets.forEach(ts=>ts.ex.forEach(ex=>{if(!allEx.find(e=>e.n===ex.n))allEx.push({n:ex.n,id:d.id});})));
const sel=DB.selEx||allEx[0].n;
const exO=allEx.find(e=>e.n===sel);
const W=wk();
let hist=[];
if(exO){const day=DAYS.find(d=>d.id===exO.id);if(day){let ti=-1,ei=-1;day.trisets.forEach((ts,a)=>ts.ex.forEach((ex,b)=>{if(ex.n===sel){ti=a;ei=b;}}));if(ti>=0)for(let s=0;s<W.series;s++){const sv=getS(exO.id,ti,ei,s);if(sv.kg)hist.push({date:“Sem “+DB.week,kg:sv.kg,reps:sv.reps});}}}
const histH=hist.length?hist.map((h,i)=>{
const pr=hist[i-1];const d2=pr&&h.kg&&pr.kg?(parseFloat(h.kg)-parseFloat(pr.kg)).toFixed(1):null;
return `<div class="card" style="padding:9px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"> <span style="font-size:11px;color:#555">${h.date} · S${i+1}</span> <span style="font-size:13px;font-weight:700">${h.kg}kg × ${h.reps||"?"} rep</span> ${d2?`<span style=“font-size:11px;color:${parseFloat(d2)>0?”#00e676”:parseFloat(d2)<0?”#ff4500”:”#555”}”>${parseFloat(d2)>0?”+”:””}${d2}kg</span>`:""} </div>`;
}).join(””):`<p style="font-size:13px;color:#555;text-align:center;padding:20px 0">Registre cargas no treino para ver histórico.</p>`;
return `<div style="padding:16px 16px 80px"> <div class="bebas" style="font-size:30px;letter-spacing:3px;color:#d4ff00;margin-bottom:2px">EVOLUÇÃO</div> <div style="font-size:12px;color:#555;margin-bottom:14px">Cargas e composição corporal</div> <div class="card" style="padding:12px;margin-bottom:12px"> <div class="lbl" style="margin-bottom:8px">Registrar Peso Corporal</div> <div style="display:flex;gap:10px;align-items:center"> <input type="number" inputmode="decimal" id="wi" placeholder="${lW||"80.5"}" style="flex:1;background:#080808;border:1px solid #282828;border-radius:8px;color:#f0f0f0;font-size:22px;font-weight:700;text-align:center;padding:10px"/> <button onclick="saveW()" style="background:#d4ff00;color:#000;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif">Salvar</button> </div> </div> ${graph} <div class="lbl" style="margin:14px 0 8px">Histórico por Exercício</div> <select onchange="DB.selEx=this.value;save();render()" style="width:100%;background:#111;border:1px solid #282828;border-radius:8px;color:#f0f0f0;font-size:14px;padding:10px;margin-bottom:10px;font-family:'DM Sans',sans-serif"> ${allEx.map(e=>`<option value=”${e.n}”${e.n===sel?” selected”:””}>${e.n}</option>`).join(””)}
</select>
${histH}

  </div>`;
}

function saveW(){
const v=parseFloat(document.getElementById(“wi”).value);
if(!v||v<30||v>250){toast(“Peso inválido”);return;}
const date=new Date().toLocaleDateString(“pt-BR”,{day:“2-digit”,month:“2-digit”});
DB.weights.push({date,val:v});save();toast(v+” kg registrado ✓”);render();
}

function renderProfile(){
const lW=DB.weights.length?DB.weights[DB.weights.length-1].val:80.5;
const imc=(lW/(1.83**2)).toFixed(1);
const tmb=Math.round(88.36+13.4*lW+4.8*183-5.7*37);
const tdee=Math.round(tmb*1.725);
const allDone=Object.entries(DB.done).filter(([k,v])=>v).map(([k])=>{const parts=k.split(”*”);const date=parts[parts.length-1];const id=parts.slice(0,-1).join(”*”);const d=DAYS.find(x=>x.id===id);return{label:d?.label||id,date};}).sort((a,b)=>b.date.localeCompare(a.date));
const logH=allDone.length?allDone.slice(0,30).map(({label,date},i,arr)=>`<div style=“display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:${i<arr.length-1?“1px solid #1a1a1a”:“none”}”>
<span style="font-size:13px;font-weight:600">${label}</span>
<span style="font-size:12px;color:#00e676">${date.slice(8)}/${date.slice(5,7)}/${date.slice(0,4)}</span>

  </div>`).join(""):`<p style="padding:12px 0;font-size:13px;color:#555">Nenhum treino registrado ainda.</p>`;
  function tbl(rows){return rows.map(([k,v,hi],i,a)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:${i<a.length-1?"1px solid #1a1a1a":"none"}">
    <span style="font-size:12px;color:#555">${k}</span><span style="font-size:14px;font-weight:700;color:${hi?"#d4ff00":"#f0f0f0"}">${v}</span>
  </div>`).join("");}
  return `<div style="padding:16px 16px 80px">
    <div class="bebas" style="font-size:30px;letter-spacing:3px;color:#d4ff00;margin-bottom:2px">PERFIL</div>
    <div style="font-size:12px;color:#555;margin-bottom:16px">Biometria · Nutrição · Log</div>
    <div class="lbl" style="margin-bottom:6px">Log de Treinos</div>
    <div class="card" style="padding:0 12px;margin-bottom:14px">${logH}</div>
    <div class="lbl" style="margin-bottom:6px">Dados Pessoais</div>
    <div class="card" style="padding:0 12px;margin-bottom:14px">${tbl([["Nome","Diego",true],["Idade","37 anos",false],["Altura","1,83 m",false],["Peso Atual",lW+" kg",true],["IMC",imc,false],["Objetivo","Hipertrofia",true]])}</div>
    <div class="lbl" style="margin-bottom:6px">Referências Nutricionais</div>
    <div class="card" style="padding:0 12px;margin-bottom:14px">${tbl([["TMB",tmb+" kcal",false],["TDEE (6x)",tdee+" kcal",true],["Hipertrofia +300",(tdee+300)+" kcal",false],["Proteína ideal",Math.round(lW*2.4)+"g/dia",true],["Água","3,5L/dia",false]])}</div>
    <button onclick="if(confirm('Apagar tudo?')){localStorage.removeItem('${SK}');location.reload();}" style="width:100%;background:none;border:1px solid #282828;border-radius:10px;padding:12px;color:#555;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif">Resetar todos os dados</button>
  </div>`;
}

// ── INIT ──
load();
render();
</script>
