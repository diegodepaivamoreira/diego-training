<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Training PRO</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial;
}

#app{max-width:480px;margin:auto;}

.header{
  padding:20px;
}

.title{
  color:#d4ff00;
  font-size:28px;
}

.card{
  background:#111;
  border-radius:14px;
  padding:15px;
  margin:10px;
}

.btn{
  background:#d4ff00;
  color:#000;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  font-weight:bold;
}

.exercise{
  margin-top:15px;
}

.series{
  display:flex;
  gap:8px;
  margin-top:5px;
}

input{
  background:#000;
  border:1px solid #333;
  border-radius:8px;
  color:#fff;
  padding:8px;
  width:60px;
}

.check{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #444;
}

.check.done{
  background:#00e676;
}

.timer{
  text-align:center;
  font-size:40px;
  margin:20px;
}
</style>
</head>

<body>

<div id="app">

<div class="header">
  <div class="title">DIEGO TRAINING</div>
  <div>Semana 1 • Volume Base</div>
</div>

<!-- DASH -->
<div class="card">
  <b>Peso:</b> 80.5kg<br>
  <b>IMC:</b> 24.0<br>
  <b>Treinos:</b> <span id="count"></span>/7
</div>

<!-- BOTÃO -->
<div class="card">
  <button class="btn" onclick="startTreino()">Iniciar Treino</button>
</div>

<!-- TREINO -->
<div id="treino" style="display:none">

<div class="card">
  <h2>BÍCEPS / TRÍCEPS</h2>

  <div id="lista"></div>

  <button class="btn" onclick="finalizar()">Treino concluído</button>

</div>

</div>

<!-- TIMER -->
<div class="card">
  <div class="timer" id="timer">60</div>
  <button class="btn" onclick="startTimer()">Iniciar descanso</button>
</div>

</div>

<script>

// BASE (SEU TREINO)
const treino = [
{
nome:"Rosca Direta",
obs:"Cotovelo fixo",
series:3
},
{
nome:"Rosca Scott",
obs:"Cadência lenta",
series:3
},
{
nome:"Tríceps Pulley",
obs:"Extensão total",
series:3
}
];

// ESTADO
let data = JSON.parse(localStorage.getItem("dados")||"{}");

// START
function startTreino(){
  document.getElementById("treino").style.display="block";
  render();
}

// RENDER
function render(){
  const div = document.getElementById("lista");
  div.innerHTML="";

  treino.forEach((ex,i)=>{

    div.innerHTML+=`
    <div class="exercise">
      <b>${ex.nome}</b><br>
      <small>${ex.obs}</small>

      ${renderSeries(i,ex.series)}
    </div>
    `;
  });
}

// SERIES
function renderSeries(i,total){
  let html="";

  for(let s=0;s<total;s++){

    let val = data[i]?.[s] || {};

    html+=`
    <div class="series">
      <input placeholder="kg" value="${val.kg||""}" oninput="save(${i},${s},'kg',this.value)">
      <input placeholder="rep" value="${val.rep||""}" oninput="save(${i},${s},'rep',this.value)">
      <div class="check ${val.done?'done':''}" onclick="toggle(${i},${s})"></div>
    </div>
    `;
  }

  return html;
}

// SALVAR
function save(i,s,key,val){
  if(!data[i]) data[i]={};
  if(!data[i][s]) data[i][s]={};

  data[i][s][key]=val;

  localStorage.setItem("dados",JSON.stringify(data));
}

// CHECK
function toggle(i,s){
  if(!data[i]) data[i]={};
  if(!data[i][s]) data[i][s]={};

  data[i][s].done = !data[i][s].done;

  localStorage.setItem("dados",JSON.stringify(data));
  render();

  startTimer(); // auto descanso
}

// FINALIZAR
function finalizar(){
  let hist = JSON.parse(localStorage.getItem("hist")||"[]");

  hist.push({
    data:new Date().toLocaleString()
  });

  localStorage.setItem("hist",JSON.stringify(hist));

  alert("Treino salvo 🔥");
  atualizarContador();
}

// CONTADOR
function atualizarContador(){
  let hist = JSON.parse(localStorage.getItem("hist")||"[]");
  document.getElementById("count").innerText = hist.length;
}

// TIMER
let tempo=60, int;

function startTimer(){
  clearInterval(int);
  tempo=60;

  int=setInterval(()=>{
    tempo--;
    document.getElementById("timer").innerText=tempo;
    if(tempo<=0) clearInterval(int);
  },1000);
}

// INIT
atualizarContador();

</script>

</body>
</html>
