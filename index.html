<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Training PRO</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
#app{max-width:480px;margin:auto}

.header{padding:20px}
.title{color:#d4ff00;font-size:26px}

.card{background:#111;border-radius:14px;padding:15px;margin:10px}

.btn{
  background:#d4ff00;color:#000;padding:14px;
  border:none;border-radius:10px;width:100%;font-weight:bold
}

.chips{display:flex;gap:8px;overflow:auto;margin:10px}
.chip{
  padding:10px 14px;
  background:#222;
  border-radius:20px;
  font-size:13px;
}
.active{background:#d4ff00;color:#000}

.exercise{margin-top:20px}
.tag{font-size:11px;background:#222;padding:4px 8px;border-radius:6px}

.series{display:flex;gap:8px;margin-top:6px;align-items:center}

input{
  background:#000;border:1px solid #333;border-radius:8px;
  color:#fff;padding:6px;width:55px
}

.check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #444;
}

.done{background:#00e676}

.slabel{font-size:12px;color:#aaa;width:25px}

.sugestao{
  color:#00e676;
  font-size:12px;
}
</style>
</head>

<body>

<div id="app">

<div class="header">
  <div class="title">DIEGO TRAINING</div>
</div>

<div class="chips">
  <div class="chip" onclick="abrir('Peito')">Peito</div>
  <div class="chip" onclick="abrir('Costas')">Costas</div>
  <div class="chip" onclick="abrir('Ombros')">Ombros</div>
  <div class="chip" onclick="abrir('Bracos')">Bíceps/Tríceps</div>
  <div class="chip" onclick="abrir('Anterior')">Anterior</div>
  <div class="chip" onclick="abrir('Posterior')">Posterior</div>
</div>

<div id="treino"></div>

</div>

<script>

const treinos = {

Bracos:[
{
tipo:"TRI-SET",
exercicios:["Rosca Direta","Rosca Scott","Rosca Alternada"],
series:3
},
{
tipo:"TRI-SET",
exercicios:["Tríceps Testa","Tríceps Pulley","Tríceps Corda"],
series:3
},
{
tipo:"ISOLADO",
exercicios:["Rosca Martelo"],
series:3
}
]

};

let atual="";
let dados = JSON.parse(localStorage.getItem("dados")||"{}");

function abrir(nome){
  atual=nome;
  render();
}

function render(){

  const treino = treinos[atual];
  if(!treino) return;

  let html = `<div class="card"><h2>${atual}</h2>`;

  treino.forEach((bloco,b)=>{

    html+=`
    <div class="exercise">
      <div class="tag">${bloco.tipo}</div>
      ${bloco.exercicios.map(e=>`<div>${e}</div>`).join("")}
      ${renderSeries(b,bloco.series)}
    </div>
    `;
  });

  html+=`<button class="btn" onclick="finalizar()">Finalizar treino</button></div>`;

  document.getElementById("treino").innerHTML = html;
}

// SERIES
function renderSeries(b,total){

  let html="";

  for(let s=0;s<total;s++){

    let val = dados[atual]?.[b]?.[s] || {};

    html+=`
    <div class="series">
      <div class="slabel">S${s+1}</div>

      <input placeholder="kg" value="${val.kg||""}"
      oninput="save(${b},${s},'kg',this.value)">

      <input placeholder="rep" value="${val.rep||""}"
      oninput="save(${b},${s},'rep',this.value)">

      <div class="check ${val.done?'done':''}"
      onclick="toggle(${b},${s})"></div>
    </div>
    `;
  }

  return html;
}

// SAVE
function save(b,s,key,val){

  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][b]) dados[atual][b]={};
  if(!dados[atual][b][s]) dados[atual][b][s]={};

  dados[atual][b][s][key]=val;

  localStorage.setItem("dados",JSON.stringify(dados));
}

// CHECK
function toggle(b,s){

  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][b]) dados[atual][b]={};
  if(!dados[atual][b][s]) dados[atual][b][s]={};

  dados[atual][b][s].done = !dados[atual][b][s].done;

  localStorage.setItem("dados",JSON.stringify(dados));

  render();
}

// FINALIZAR + INTELIGÊNCIA
function finalizar(){

  let hist = JSON.parse(localStorage.getItem("hist")||"[]");

  hist.push({
    treino:atual,
    data:new Date().toLocaleString()
  });

  localStorage.setItem("hist",JSON.stringify(hist));

  analisarProgressao();

  alert("Treino salvo 🔥");
}

// INTELIGÊNCIA
function analisarProgressao(){

  let treino = dados[atual];

  let completo = true;

  for(let b in treino){
    for(let s in treino[b]){
      if(!treino[b][s].done){
        completo=false;
      }
    }
  }

  if(completo){
    alert("🔥 Próximo treino: aumente a carga!");
  }
}

</script>

</body>
</html>
