<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diego Training</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#f0f0f0;font-family:Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{display:flex;background:#111;border-top:1px solid #282828;flex-shrink:0}
.nb{flex:1;background:none;border:none;color:#555;font-size:10px;padding:10px 2px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Arial}
.nb.on{color:#d4ff00}
.nb svg{width:22px;height:22px}
.pg{padding:16px 16px 80px}
.card{background:#111;border:1px solid #282828;border-radius:12px;margin-bottom:10px;overflow:hidden}
.cp{padding:12px 14px}
.ttl{font-size:26px;font-weight:900;letter-spacing:2px;color:#d4ff00;margin-bottom:3px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#555;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1a1a1a}
.row:last-child{border-bottom:none}
input[type=number]{-webkit-appearance:none;appearance:none;background:#0a0a0a;border:1px solid #282828;border-radius:6px;color:#f0f0f0;font-size:13px;font-weight:700;text-align:center;padding:4px 2px;width:42px;font-family:Arial}
input[type=number]::-webkit-inner-spin-button{display:none}
textarea{background:#111;border:1px solid #282828;border-radius:10px;color:#f0f0f0;font-size:13px;padding:10px;resize:none;width:100%;font-family:Arial;min-height:60px}
select{background:#111;border:1px solid #282828;border-radius:8px;color:#f0f0f0;font-size:13px;padding:10px;width:100%;font-family:Arial;margin-bottom:10px}
.btn{display:block;width:100%;background:#d4ff00;color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:Arial;margin-top:10px}
.btnd{background:#1a1a1a;color:#555;border:1px solid #282828}
.btng{background:#00e676}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #282828;background:transparent;cursor:pointer;font-size:10px;color:transparent;flex-shrink:0;font-family:Arial;display:inline-flex;align-items:center;justify-content:center}
.ckon{background:#00e676;border-color:#00e676;color:#000}
#tmr{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.96);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center;padding:20px}
#tnum{font-size:90px;font-weight:900;color:#d4ff00;line-height:1}
#tst{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00e676;color:#000;padding:9px 22px;border-radius:20px;font-weight:700;font-size:13px;z-index:1000;display:none;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="scr"></div>
  <div id="nav">
    <button class="nb on" id="n0" onclick="go(0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Início</button>
    <button class="nb" id="n1" onclick="go(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>Treino</button>
    <button class="nb" id="n2" onclick="go(2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Ciclo</button>
    <button class="nb" id="n3" onclick="go(3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Evolução</button>
    <button class="nb" id="n4" onclick="go(4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Perfil</button>
  </div>
</div>
<div id="tmr" onclick="closeT()">
  <div class="lbl" style="color:#555;margin-bottom:10px">DESCANSO · toque para fechar</div>
  <div id="tnum">60</div>
  <div id="tgo" style="font-size:22px;font-weight:900;color:#00e676;min-height:30px;margin-top:6px"></div>
  <div id="tnx" style="font-size:12px;color:#555;margin-top:6px;min-height:30px"></div>
  <div style="display:flex;gap:16px;margin-top:20px" onclick="event.stopPropagation()">
    <button onclick="tadj(-15)" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#aaa;width:42px;height:42px;font-size:22px;cursor:pointer;font-family:Arial">-</button>
    <span id="ttot" style="font-size:13px;color:#555;line-height:42px;min-width:36px;text-align:center;font-weight:700"></span>
    <button onclick="tadj(15)" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#aaa;width:42px;height:42px;font-size:22px;cursor:pointer;font-family:Arial">+</button>
  </div>
</div>
<div id="tst"></div>
<script>
var WC=[
{num:1,name:"Volume Base",series:3,reps:"10",rest:60,drop:false},
{num:2,name:"Sobrecarga Progressiva",series:4,reps:"8",rest:75,drop:false},
{num:3,name:"Choque Metabolico",series:3,reps:"12-15",rest:45,drop:true},
{num:4,name:"Deload Ativo",series:2,reps:"10",rest:60,drop:false}
];
var DAYS=[
{id:"peito",label:"PEITO",short:"Pei",wd:"Dia 1",sub:"Peito · Ombro · Tríceps",trisets:[
{label:"Peito",single:true,ex:[
{n:"Supino Reto com Barra",t:"Barra desce até 1cm do esterno. Cotovelos a 75°."},
{n:"Supino Inclinado com Haltere",t:"45°. Amplitude máxima na descida. Sem tocar os halteres no topo."},
{n:"Crossover Polia Alta",t:"Adução completa, cruzando na frente. Pausa 1s na contração."},
{n:"Peck Deck / Voador",t:"Leve flexão de cotovelo fixa. Squeeze no pico. Tensão constante."}
]},
{label:"Ombro",single:true,ex:[
{n:"Elevação Lateral com Haltere",t:"Polegar para baixo. Cotovelo levemente flexionado. Até 90°."}
]},
{label:"Tríceps",single:true,ex:[
{n:"Tríceps Testa com Barra EZ",t:"Cotovelos fixos apontados para cima. Descida lenta 3s."},
{n:"Tríceps Pulley Corda",t:"Extensão completa no final. Separa a corda."}
]}
]},
{id:"costas",label:"COSTAS",short:"Cos",wd:"Dia 2",sub:"Costas · Lombar · Bíceps",trisets:[
{label:"Costas",single:true,ex:[
{n:"Puxada Frontal Pegada Larga",t:"Pegada pronada. Cotovelos puxam para baixo. Escápulas juntas."},
{n:"Remada Curvada com Barra",t:"Tronco 45°. Cotovelo próximo ao corpo. Retrai a escápula."},
{n:"Remada Unilateral com Haltere",t:"Apoia o joelho. Rotação escapular completa no topo."},
{n:"Pullover na Polia Alta",t:"Braço semi-estendido. Puxar do alto até o quadril. Enfatiza dorsal."}
]},
{label:"Quadrado Lombar",single:true,ex:[
{n:"Hiperextensão no Banco Romano",t:"Quadril fixo. Sobe até paralelo ao chão. Controle a descida."}
]},
{label:"Bíceps",single:true,ex:[
{n:"Rosca Direta com Barra EZ",t:"Supinação completa. Sem balanço do tronco. Cotovelos fixos."},
{n:"Rosca Martelo com Haltere",t:"Trabalha braquial e braquiorradial. Pulso neutro."}
]}
]},
{id:"perna",label:"PERNA",short:"Per",wd:"Dia 3",sub:"Quadríceps · Posterior · Panturrilha",trisets:[
{label:"Quadríceps",single:true,ex:[
{n:"Agachamento Livre",t:"Pés largos. Desce abaixo de 90°. Joelhos seguem os pés."},
{n:"Leg Press 45",t:"Pés estreitos e baixos para isolar quadríceps."},
{n:"Cadeira Extensora",t:"Descida lenta 3s. Pausa 1s no topo. Contração máxima."},
{n:"Agachamento Búlgaro",t:"Pé traseiro no banco. Desce o joelho frontal ao chão."}
]},
{label:"Posterior de Coxa",single:true,ex:[
{n:"Stiff com Barra",t:"Joelho levemente flexionado. Sente o alongamento do ísquio."},
{n:"Cadeira Flexora Deitado",t:"Quadril fixo. Controle a descida. Amplitude máxima."},
{n:"Mesa Flexora",t:"Quadril encaixado no suporte. Sobe até 90°."}
]},
{label:"Panturrilha e Adutores",single:true,ex:[
{n:"Panturrilha em Pé",t:"Pausa 1s no alto e no baixo. Amplitude total. Sem impulso."},
{n:"Cadeira Adutora",t:"Pressão constante. Controle total na volta."}
]}
]},
{id:"ombros",label:"OMBRO",short:"Omb",wd:"Dia 4",sub:"Ombros · Bíceps · Tríceps",trisets:[
{label:"Ombros",single:true,ex:[
{n:"Desenvolvimento com Haltere",t:"Cadência 2-1-2. Amplitude máxima. Cotovelos alinhados."},
{n:"Elevação Lateral com Haltere",t:"Polegar para baixo. Cotovelo levemente flexionado. 4x15."},
{n:"Elevação Lateral na Polia Baixa",t:"Tensão constante em todo o arco do movimento."},
{n:"Elevação Frontal Alternado",t:"Braço reto. Até a linha dos olhos. Controle a descida."},
{n:"Crucifixo Inverso na Máquina",t:"Deltóide posterior. Braços até paralelo ao solo. Pausa no topo."}
]},
{label:"Bíceps",single:true,ex:[
{n:"Rosca Scott na Máquina",t:"Cadência lenta 3s na descida. Pausa no pico de contração."},
{n:"Rosca Inclinada com Haltere",t:"Banco a 45°. Supinação completa na subida."}
]},
{label:"Tríceps",single:true,ex:[
{n:"Tríceps Francês com Haltere",t:"Cotovelos fixos apontados para cima. Não feche no topo."},
{n:"Tríceps Cross Corda",t:"Polia alta. Extensão completa. Separa a corda no final."}
]}
]},
{id:"cardio",label:"CARDIO",short:"Car",wd:"Cardio",sub:"Cardio · Abdome",isRest:true,trisets:[
{label:"Cardio",single:true,ex:[
{n:"Esteira Inclinada ou Escada",t:"30-40 min. Zona 2. FC 120-140 bpm."}
]},
{label:"Abdome",single:true,ex:[
{n:"Abdominal Supra",t:"Sobe até 30° do solo. Controle a descida."},
{n:"Elevação de Pernas Suspenso",t:"Joelhos dobrados. Quadril levanta no final."},
{n:"Prancha Frontal",t:"Quadril neutro. 3x45s."},
{n:"Oblíquo Bicicleta",t:"Cotovelo toca joelho oposto. 3x20 alternados."},
{n:"Hollow Body Hold",t:"Lombar colada no chão. 2x30s."}
]}
]},
{id:"descanso",label:"DESCANSO",short:"Off",wd:"Off",sub:"Recuperação",isRest:true,trisets:[
{label:"Descanso Ativo",single:true,ex:[
{n:"Mobilidade ou Alongamento",t:"20-30 min. Foco nos grupos trabalhados nos últimos dias."}
]}
]}
];

var SK="dtv3";
var DB={week:1,sets:{},done:{},obs:{},weights:[],selEx:""};
var curTab=0,curDay=0;
var tInt=null,tRem=0,tTot=0,tNx="";

function nextDay(){
var lastIdx=-1,lastDate="";
for(var i=0;i<DAYS.length;i++){var ld2=lastDone(DAYS[i].id);if(ld2&&ld2>lastDate){lastDate=ld2;lastIdx=i;}}
return(lastIdx+1)%DAYS.length;
}
function load(){
try{var s=localStorage.getItem(SK);if(s){var p=JSON.parse(s);DB.week=p.week||1;DB.sets=p.sets||{};DB.done=p.done||{};DB.obs=p.obs||{};DB.weights=p.weights||[];DB.selEx=p.selEx||"";}}catch(e){}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function wk(){return WC[(DB.week-1)%4];}
function tod(){return new Date().toISOString().slice(0,10);}
function dkey(id){return id+"*"+tod();}
function isDone(id){return !!DB.done[dkey(id)];}
function lastDone(id){
var p=id+"*",res=[];
for(var k in DB.done){if(k.indexOf(p)===0&&DB.done[k])res.push(k.slice(p.length));}
res.sort();return res.length?res[res.length-1]:null;
}
function sk(d,a,b,c){return d+"*"+a+"*"+b+"_"+c;}
function getS(d,a,b,c){var v=DB.sets[sk(d,a,b,c)];return v||{kg:"",reps:"",done:false};}
function setS(d,a,b,c,f,v){var k=sk(d,a,b,c);var o=getS(d,a,b,c);o[f]=v;DB.sets[k]=o;save();}
function ns(ts){return wk().series;}

function toast(msg){
var t=document.getElementById("tst");
t.textContent=msg;t.style.display="block";
clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},2500);
}

function startT(nx){
clearInterval(tInt);
tTot=wk().rest;tRem=tTot;tNx=nx||"";
document.getElementById("tmr").style.display="flex";
document.getElementById("tgo").textContent="";
document.getElementById("tnum").style.color="#d4ff00";
updT();
tInt=setInterval(function(){
tRem--;updT();
if(tRem<=0){
clearInterval(tInt);
document.getElementById("tnum").textContent="VA!";
document.getElementById("tnum").style.color="#00e676";
try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300]);}catch(e){}
setTimeout(closeT,2000);
}
},1000);
}
function updT(){
document.getElementById("tnum").textContent=tRem;
document.getElementById("tnum").style.color=tRem<=10?"#ff4500":"#d4ff00";
document.getElementById("ttot").textContent=tTot+"s";
document.getElementById("tnx").textContent=tNx?"Proximo: "+tNx:"";
}
function tadj(d){tTot=Math.min(300,Math.max(15,tTot+d));tRem=Math.max(1,tRem+d);updT();}
function closeT(){clearInterval(tInt);document.getElementById("tmr").style.display="none";}

function go(t){
curTab=t;
for(var i=0;i<5;i++){document.getElementById("n"+i).className="nb"+(i===t?" on":"");}
render();
document.getElementById("scr").scrollTop=0;
}
function goDay(i){curDay=i;go(1);}

function render(){
var s=document.getElementById("scr");
if(curTab===0)s.innerHTML=rDash();
else if(curTab===1)s.innerHTML=rTreino();
else if(curTab===2)s.innerHTML=rCiclo();
else if(curTab===3)s.innerHTML=rEvol();
else s.innerHTML=rProfile();
}

function chip(d,i,ti){
var dd=isDone(d.id),it=i===ti,ld=lastDone(d.id);
var ds=ld?(ld.slice(8)+"/"+ld.slice(5,7)):d.wd;
var bc=it?"#d4ff00":dd?"#00e676":"#282828";
var tc=it?"#d4ff00":dd?"#00e676":"#555";
var bg=dd?"#0a1a0a":"#111";
var dc=it?"#d4ff00":dd?"#00e676":"#333";
return '<div onclick="goDay('+i+')" style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;border:1.5px solid '+bc+';background:'+bg+';min-width:46px;cursor:pointer">'
+'<span style="font-size:9px;font-weight:700;text-transform:uppercase;color:'+tc+'">'+d.short+'</span>'
+'<div style="width:7px;height:7px;border-radius:50%;background:'+dc+'"></div>'
+'<span style="font-size:8px;color:'+tc+'">'+ds+'</span></div>';
}

function rDash(){
var ti=nextDay();
var day=DAYS[ti],done=isDone(day.id),W=wk();
var lW=DB.weights.length?DB.weights[DB.weights.length-1].val:null;
var pW=DB.weights.length>1?DB.weights[DB.weights.length-2].val:null;
var wd=lW&&pW?((lW-pW).toFixed(1)):null;
var chips="";
for(var i=0;i<DAYS.length;i++)chips+=chip(DAYS[i],i,ti);
var imc=lW?(lW/3.3489).toFixed(1):"–";
var wdStr=wd?(parseFloat(wd)>0?"+":"")+wd+"kg":lW?"estavel":"sem reg.";
var wdC=wd&&parseFloat(wd)>0?"#00e676":wd&&parseFloat(wd)<0?"#ff4500":"#555";
return '<div style="padding:20px 16px 12px;background:linear-gradient(160deg,#0f1a00,#080808 70%)">'
+'<div style="font-size:28px;font-weight:900;letter-spacing:3px;color:#d4ff00;line-height:1.1">DIEGO TRAINING</div>'
+'<div class="lbl" style="margin-top:4px">Semana '+DB.week+' - '+W.name+'</div></div>'
+'<div style="padding:10px 16px 0"><div class="lbl" style="margin-bottom:8px">Historico</div>'
+'<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">'+chips+'</div></div>'
+'<div class="pg">'
+'<div class="card" style="border-color:'+(done?"#00e676":"#282828")+'">'
+'<div class="cp" style="display:flex;align-items:flex-start;justify-content:space-between">'
+'<div><div class="lbl">Próximo · '+day.wd+'</div>'
+'<div style="font-size:24px;font-weight:900;color:#f0f0f0;margin-top:2px">'+day.label+'</div>'
+'<div style="font-size:12px;color:#aaa;margin-top:2px">'+day.sub+'</div></div>'
+'<div style="background:'+(done?"#00e676":day.isRest?"#1a1a1a":"#d4ff00")+';color:#000;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;margin-top:4px">'
+(done?"FEITO":day.isRest?"DESCANSO":"HOJE")+'</div></div>'
+'<div class="cp" style="padding-top:0"><button onclick="goDay('+ti+')" class="btn'+(done?" btnd":"")+'">'+( done?"Treino Concluido":"Iniciar Treino")+'</button></div></div>'
+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px">'
+'<div class="card cp"><div class="lbl" style="margin-bottom:5px">Peso</div><div style="font-size:26px;font-weight:900;color:#f0f0f0">'+( lW?lW+"kg":"–")+'</div><div style="font-size:11px;color:'+wdC+';margin-top:3px">'+wdStr+'</div></div>'
+'<div class="card cp"><div class="lbl" style="margin-bottom:5px">Descanso</div><div style="font-size:26px;font-weight:900;color:#f0f0f0">'+W.rest+'s</div><div style="font-size:11px;color:#555;margin-top:3px">'+W.name+'</div></div>'
+'<div class="card cp"><div class="lbl" style="margin-bottom:5px">IMC</div><div style="font-size:26px;font-weight:900;color:#f0f0f0">'+imc+'</div><div style="font-size:11px;color:#555;margin-top:3px">1,83m</div></div>'
+'<div class="card cp"><div class="lbl" style="margin-bottom:5px">Semana</div><div style="font-size:26px;font-weight:900;color:#d4ff00">'+DB.week+'</div><div style="font-size:11px;color:#555;margin-top:3px">'+W.name+'</div></div>'
+'</div></div>';
}

function rTreino(){
var day=DAYS[curDay],W=wk(),done=isDone(day.id),ld=lastDone(day.id);
var tabs="";
for(var i=0;i<DAYS.length;i++){
var d=DAYS[i],dd=isDone(d.id);
tabs+='<button onclick="curDay='+i+';render()" style="flex-shrink:0;padding:5px 11px;border-radius:20px;border:1px solid '+(i===curDay?"#d4ff00":dd?"#00e676":"#282828")+';background:'+(i===curDay?"#d4ff00":"transparent")+';color:'+(i===curDay?"#000":dd?"#00e676":"#555")+';font-size:12px;font-weight:'+(i===curDay?700:500)+';cursor:pointer;white-space:nowrap;font-family:Arial">'+d.short+(dd?" v":"")+'</button>';
}
var lastB=ld?'<div style="background:#0a1a0a;border:1px solid #00e676;border-radius:20px;padding:4px 12px;font-size:11px;color:#00e676;margin-bottom:12px;display:inline-block">Ultimo: '+ld.slice(8)+"/"+ld.slice(5,7)+"/"+ld.slice(0,4)+'</div>':"";
var body="";
for(var ti=0;ti<day.trisets.length;ti++){
var ts=day.trisets[ti];
var badge=ts.single?"SERIE":day.isRest?"CARDIO":"TRI-SET";
var bbg=ts.single?"#1a1a1a":"#d4ff00",btc=ts.single?"#555":"#000";
var exH="";
for(var ei=0;ei<ts.ex.length;ei++){
var ex=ts.ex[ei],n=ns(ts);
var drop=W.drop&&!ts.single&&ei===ts.ex.length-1;
var nx=ei+1<ts.ex.length?ts.ex[ei+1].n:(ti+1<day.trisets.length&&day.trisets[ti+1].ex.length?day.trisets[ti+1].ex[0].n:"");
var nxS=nx.replace(/'/g,"");
var sH="";
for(var s=0;s<n;s++){
var sv=getS(day.id,ti,ei,s);
sH+='<div style="display:inline-flex;align-items:center;gap:4px;background:#0a0a0a;border:1px solid '+(sv.done?"#00e676":"#282828")+';border-radius:8px;padding:5px 6px;margin:2px">'
+'<span style="font-size:9px;color:#555;font-weight:700;min-width:16px">S'+(s+1)+'</span>'
+'<input type="number" inputmode="decimal" placeholder="kg" value="'+(sv.kg||"")+'" onchange="setS(\''+day.id+'\','+ti+','+ei+','+s+',\'kg\',this.value)">'
+'<span style="font-size:9px;color:#333">x</span>'
+'<input type="number" inputmode="numeric" placeholder="rep" value="'+(sv.reps||"")+'" onchange="setS(\''+day.id+'\','+ti+','+ei+','+s+',\'reps\',this.value)">'
+'<button class="ck'+(sv.done?" ckon":"")+'" onclick="togS(\''+day.id+'\','+ti+','+ei+','+s+',\''+nxS+'\')">v</button>'
+'</div>';
}
exH+='<div style="padding:8px 0;border-bottom:'+(ei<ts.ex.length-1?"1px solid #1a1a1a":"none")+'">'
+'<div style="font-size:14px;font-weight:700;color:#f0f0f0;margin-bottom:4px">'+ex.n+'</div>'
+(ex.t?'<div style="font-size:11px;color:#00e5ff;margin-bottom:6px;font-style:italic">'+ex.t+'</div>':"")
+(drop?'<div style="font-size:9px;color:#ff4500;font-weight:700;border:1px solid #ff4500;display:inline-block;padding:1px 6px;border-radius:4px;margin-bottom:6px">DROP-SET NA ULTIMA SERIE</div>':"")
+'<div style="display:flex;flex-wrap:wrap">'+sH+'</div></div>';
}
body+='<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:#181818;border-bottom:1px solid #282828">'
+'<span style="background:'+bbg+';color:'+btc+';font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px">'+badge+'</span>'
+'<span style="font-size:11px;font-weight:600;color:#555;flex:1;text-transform:uppercase">'+ts.label+'</span>'
+(!ts.single?'<span style="font-size:11px;color:#d4ff00;font-weight:700">'+W.series+'x'+W.reps+'</span>':"")
+'</div><div class="cp">'+exH+'</div></div>';
}
return '<div style="padding:12px 16px 8px;background:#080808;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10">'
+'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
+'<div style="font-size:22px;font-weight:900;letter-spacing:2px;color:#d4ff00">'+day.label+'</div>'
+'<div style="font-size:11px;color:#555;text-align:right;line-height:1.5"><strong style="color:#aaa">Sem '+W.num+' - '+W.name+'</strong><br>'+W.series+'x'+W.reps+' - '+W.rest+'s</div>'
+'</div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">'+tabs+'</div></div>'
+'<div class="pg">'+lastB
+'<div class="card cp" style="margin-bottom:12px;display:flex;gap:12px;align-items:center">'
+'<div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#d4ff00">'+W.series+'</div><div class="lbl">Series</div></div>'
+'<div style="width:1px;height:26px;background:#282828"></div>'
+'<div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#d4ff00">'+W.reps+'</div><div class="lbl">Reps</div></div>'
+'<div style="width:1px;height:26px;background:#282828"></div>'
+'<div style="text-align:center"><div style="font-size:20px;font-weight:900;color:#d4ff00">'+W.rest+'s</div><div class="lbl">Descanso</div></div>'
+'<div style="width:1px;height:26px;background:#282828"></div>'
+'<div style="flex:1"><strong style="font-size:13px;color:#f0f0f0">'+W.name+'</strong>'+(W.drop?'<div style="font-size:11px;color:#ff4500">Drop-set ativo</div>':"")+'</div></div>'
+body
+'<div style="margin-top:12px"><div class="lbl" style="margin-bottom:5px">Observacoes</div>'
+'<textarea onchange="DB.obs[\''+day.id+'\']=this.value;save()" placeholder="Cargas, sensacoes, PR...">'+( DB.obs[day.id]||"")+'</textarea></div>'
+'<button onclick="togDone(\''+day.id+'\')" class="btn'+(done?" btng":"")+'">'+(done?"Concluido - toque para desfazer":"Marcar como Concluido")+'</button></div>';
}

function togS(d,ti,ei,si,nx){var sv=getS(d,ti,ei,si);var nv=!sv.done;setS(d,ti,ei,si,"done",nv);if(nv)startT(nx);render();}
function togDone(id){var nv=!isDone(id);DB.done[dkey(id)]=nv;save();if(nv)toast("Treino concluido! Salvo.");render();}

function rCiclo(){
var cur=WC[(DB.week-1)%4],h='<div class="pg"><div class="ttl">CICLO</div><div class="lbl" style="margin-bottom:14px">Periodizacao 4 semanas</div>';
for(var i=0;i<WC.length;i++){
var w=WC[i],ic=w.num===cur.num;
h+='<div class="card" style="border-color:'+(ic?"#d4ff00":"#282828")+';margin-bottom:10px">'
+'<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#181818;border-bottom:1px solid #282828">'
+'<span style="font-size:12px;font-weight:700;color:'+(ic?"#d4ff00":"#555")+'">SEM '+w.num+'</span>'
+'<span style="font-size:13px;font-weight:700;color:'+(ic?"#d4ff00":"#f0f0f0")+';flex:1">'+w.name+'</span>'
+(ic?'<span style="background:#d4ff00;color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">ATUAL</span>':"")
+'</div><div class="cp" style="display:flex;gap:8px;flex-wrap:wrap">'
+'<div style="background:#202020;border:1px solid #282828;border-radius:6px;padding:5px 10px;text-align:center"><div style="font-size:16px;font-weight:900;color:#d4ff00">'+w.series+'</div><div class="lbl">Series</div></div>'
+'<div style="background:#202020;border:1px solid #282828;border-radius:6px;padding:5px 10px;text-align:center"><div style="font-size:16px;font-weight:900;color:#d4ff00">'+w.reps+'</div><div class="lbl">Reps</div></div>'
+'<div style="background:#202020;border:1px solid #282828;border-radius:6px;padding:5px 10px;text-align:center"><div style="font-size:16px;font-weight:900;color:#d4ff00">'+w.rest+'s</div><div class="lbl">Descanso</div></div>'
+'<div style="background:#202020;border:1px solid #282828;border-radius:6px;padding:5px 10px;text-align:center"><div style="font-size:16px;font-weight:900;color:#d4ff00">'+(w.drop?"SIM":"NAO")+'</div><div class="lbl">Drop</div></div>'
+'</div></div>';
}
h+='<div style="margin-top:14px"><div class="lbl" style="margin-bottom:8px">Semana do Programa</div>'
+'<div style="display:flex;gap:8px;align-items:center">'
+'<button onclick="if(DB.week>1){DB.week--;save();render();}" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#f0f0f0;width:44px;height:44px;font-size:24px;cursor:pointer;font-family:Arial">-</button>'
+'<div style="flex:1;background:#111;border:1px solid #282828;border-radius:8px;padding:10px;text-align:center;font-size:22px;font-weight:900;letter-spacing:2px;color:#d4ff00">SEMANA '+DB.week+'</div>'
+'<button onclick="DB.week++;save();toast(\'Semana \'+DB.week);render();" style="background:#1a1a1a;border:1px solid #282828;border-radius:8px;color:#f0f0f0;width:44px;height:44px;font-size:24px;cursor:pointer;font-family:Arial">+</button>'
+'</div></div></div>';
return h;
}

function rEvol(){
var ws=DB.weights,lW=ws.length?ws[ws.length-1].val:null;
var graph="";
if(ws.length>1){
var vals=[],i;for(i=0;i<ws.length;i++)vals.push(ws[i].val);
var mn=vals[0],mx=vals[0];for(i=1;i<vals.length;i++){if(vals[i]<mn)mn=vals[i];if(vals[i]>mx)mx=vals[i];}
mn-=1;mx+=1;
var W2=300,H2=60,xs=vals.length>1?W2/(vals.length-1):0;
var pts="",dots="";
for(i=0;i<vals.length;i++){var x=i*xs,y=H2-((vals[i]-mn)/(mx-mn))*H2;pts+=(i?" ":"")+x+","+y;dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#d4ff00"/>';}
graph='<div class="card cp" style="margin-bottom:12px"><div class="lbl" style="margin-bottom:8px">Peso (kg)</div>'
+'<svg viewBox="0 0 300 60" style="width:100%;height:60px;display:block"><polyline points="'+pts+'" fill="none" stroke="#d4ff00" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg>'
+'<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:10px;color:#555">'+ws[0].date+'</span><span style="font-size:10px;color:#555">'+ws[ws.length-1].date+'</span></div></div>';
}
var allEx=[],i,j,k;
for(i=0;i<DAYS.length;i++)for(j=0;j<DAYS[i].trisets.length;j++)for(k=0;k<DAYS[i].trisets[j].ex.length;k++){var ex=DAYS[i].trisets[j].ex[k],found=false;for(var m=0;m<allEx.length;m++)if(allEx[m].n===ex.n){found=true;break;}if(!found)allEx.push({n:ex.n,id:DAYS[i].id});}
var sel=DB.selEx||allEx[0].n,opts="";
for(i=0;i<allEx.length;i++)opts+='<option value="'+allEx[i].n+'"'+(allEx[i].n===sel?" selected":"")+'>'+allEx[i].n+'</option>';
var W=wk(),hist=[];
for(i=0;i<DAYS.length;i++)for(j=0;j<DAYS[i].trisets.length;j++)for(k=0;k<DAYS[i].trisets[j].ex.length;k++)if(DAYS[i].trisets[j].ex[k].n===sel)for(var s=0;s<W.series;s++){var sv=getS(DAYS[i].id,j,k,s);if(sv.kg)hist.push({date:"Sem "+DB.week,kg:sv.kg,reps:sv.reps});}
var histH=hist.length?"":"<div style='font-size:13px;color:#555;text-align:center;padding:16px 0'>Registre cargas no treino.</div>";
for(i=0;i<hist.length;i++){var h=hist[i],pr=hist[i-1],d2=pr&&h.kg&&pr.kg?((parseFloat(h.kg)-parseFloat(pr.kg)).toFixed(1)):null;histH+='<div class="card cp" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;color:#555">'+h.date+' S'+(i+1)+'</span><span style="font-size:13px;font-weight:700">'+h.kg+'kg x '+(h.reps||"?")+'</span>'+(d2?'<span style="font-size:11px;color:'+(parseFloat(d2)>0?"#00e676":parseFloat(d2)<0?"#ff4500":"#555")+'">'+(parseFloat(d2)>0?"+":"")+d2+'kg</span>':"")+'</div>';}
return '<div class="pg"><div class="ttl">EVOLUCAO</div><div class="lbl" style="margin-bottom:14px">Cargas e composicao corporal</div>'
+'<div class="card cp" style="margin-bottom:12px"><div class="lbl" style="margin-bottom:8px">Registrar Peso</div>'
+'<div style="display:flex;gap:10px;align-items:center"><input type="number" inputmode="decimal" id="wi" placeholder="'+(lW||"80.5")+'" style="flex:1;font-size:22px;font-weight:700;padding:10px;text-align:center;background:#0a0a0a;border:1px solid #282828;border-radius:8px;color:#f0f0f0;width:auto">'
+'<button onclick="saveW()" style="background:#d4ff00;color:#000;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:Arial">Salvar</button></div></div>'
+graph+'<div class="lbl" style="margin-bottom:8px;margin-top:14px">Por Exercicio</div>'
+'<select onchange="DB.selEx=this.value;save();render()">'+opts+'</select>'+histH+'</div>';
}
function saveW(){var el=document.getElementById("wi"),v=parseFloat(el.value);if(!v||v<30||v>250){toast("Peso invalido");return;}var date=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});DB.weights.push({date:date,val:v});save();toast(v+" kg salvo!");render();}

function rProfile(){
var lW=DB.weights.length?DB.weights[DB.weights.length-1].val:80.5;
var imc=(lW/3.3489).toFixed(1),tmb=Math.round(88.36+13.4*lW+4.8*183-5.7*37),tdee=Math.round(tmb*1.725);
var allDone=[],k;
for(k in DB.done)if(DB.done[k]){var pts=k.split("*"),date=pts[pts.length-1],id=pts.slice(0,-1).join("*"),fd=null;for(var i=0;i<DAYS.length;i++)if(DAYS[i].id===id){fd=DAYS[i];break;}allDone.push({label:fd?fd.label:id,date:date});}
allDone.sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0;});
var logH="";
if(!allDone.length)logH='<div style="padding:12px 0;font-size:13px;color:#555">Nenhum treino registrado ainda.</div>';
else for(var i=0;i<Math.min(allDone.length,30);i++){var x=allDone[i];logH+='<div class="row"><span style="font-size:13px;font-weight:700">'+x.label+'</span><span style="font-size:12px;color:#00e676">'+x.date.slice(8)+"/"+x.date.slice(5,7)+"/"+x.date.slice(0,4)+'</span></div>';}
function tr(k,v,hi){return '<div class="row"><span style="font-size:12px;color:#555">'+k+'</span><span style="font-size:14px;font-weight:700;color:'+(hi?"#d4ff00":"#f0f0f0")+'">'+v+'</span></div>';}
return '<div class="pg"><div class="ttl">PERFIL</div><div class="lbl" style="margin-bottom:14px">Biometria - Nutricao - Log</div>'
+'<div class="lbl" style="margin-bottom:6px">Log de Treinos</div><div class="card" style="padding:0 12px;margin-bottom:14px">'+logH+'</div>'
+'<div class="lbl" style="margin-bottom:6px">Dados</div><div class="card" style="padding:0 12px;margin-bottom:14px">'+tr("Nome","Diego",true)+tr("Peso",lW+"kg",true)+tr("Altura","1,83m",false)+tr("Idade","37 anos",false)+tr("IMC",imc,false)+tr("Objetivo","Hipertrofia",true)+'</div>'
+'<div class="lbl" style="margin-bottom:6px">Nutricao</div><div class="card" style="padding:0 12px;margin-bottom:14px">'+tr("TMB",tmb+" kcal",false)+tr("TDEE 6x",tdee+" kcal",true)+tr("Meta +300",(tdee+300)+" kcal",false)+tr("Proteina ideal",Math.round(lW*2.4)+"g/dia",true)+tr("Agua","3,5L/dia",false)+'</div>'
+'<button onclick="if(confirm(\'Apagar tudo?\')){localStorage.removeItem(\''+SK+'\');location.reload();}" class="btn btnd">Resetar dados</button></div>';
}

load();
render();
</script>
