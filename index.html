<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Training</title>
<style>
body{background:#080808;color:#f0f0f0;font-family:Arial,sans-serif;margin:0;padding:20px}
#log{background:#111;border:1px solid #282828;border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.8}
.ok{color:#00e676}
.er{color:#ff4500}
</style>
</head>
<body>
<div style="font-size:22px;font-weight:900;color:#d4ff00;margin-bottom:12px">DIEGO TRAINING</div>
<div id="log">Iniciando testes...</div>
<script>
var log = document.getElementById('log');
var html = '';

function ok(msg) { html += ’<div class="ok">OK: ’ + msg + ‘</div>’; log.innerHTML = html; }
function er(msg) { html += ’<div class="er">ERRO: ’ + msg + ‘</div>’; log.innerHTML = html; }

try { ok(‘Script iniciou’); } catch(e) { er(’Script nao iniciou: ’ + e); }

try {
var x = localStorage.getItem(‘teste’);
ok(‘localStorage funciona’);
} catch(e) { er(’localStorage: ’ + e); }

try {
localStorage.setItem(‘teste’, ‘123’);
ok(‘localStorage.setItem funciona’);
} catch(e) { er(’localStorage.setItem: ’ + e); }

try {
var d = document.createElement(‘div’);
d.textContent = ‘teste’;
document.body.appendChild(d);
ok(‘DOM manipulation funciona’);
} catch(e) { er(’DOM: ’ + e); }

try {
var arr = [1,2,3];
var r = arr.map(function(x){ return x*2; });
ok(’Array.map funciona: ’ + r);
} catch(e) { er(’Array.map: ’ + e); }

try {
var obj = JSON.parse(’{“a”:1}’);
ok(’JSON.parse funciona: ’ + obj.a);
} catch(e) { er(’JSON.parse: ’ + e); }

try {
var dt = new Date();
ok(’Date funciona: ’ + dt.toISOString().slice(0,10));
} catch(e) { er(’Date: ’ + e); }

try {
var scr = document.getElementById(‘log’);
scr.innerHTML = html + ‘<div class="ok">OK: getElementById funciona</div>’;
html = scr.innerHTML;
} catch(e) { er(’getElementById: ’ + e); }

try {
var WC = [{num:1,name:“Teste”}];
ok(’Array de objetos funciona: ’ + WC[0].name);
} catch(e) { er(’Array objetos: ’ + e); }

ok(‘Todos os testes concluidos’);
</script>

</body>
</html>
