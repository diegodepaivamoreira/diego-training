<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>Diego Training PRO</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
#app{max-width:520px;margin:auto}

/* HEADER */
.header{
  padding:20px;
}
.title{
  color:#d4ff00;
  font-size:26px;
  font-weight:bold;
}

/* NAV */
.nav{
  display:flex;
  border-top:1px solid #222;
}
.nav button{
  flex:1;
  padding:10px;
  background:#111;
  color:#777;
  border:none;
}
.nav .active{color:#d4ff00}

/* CARD */
.card{
  background:#111;
  margin:10px;
  padding:15px;
  border-radius:14px;
}

/* HOME */
.big{font-size:22px;font-weight:bold}
.btn{
  background:#d4ff00;
  color:#000;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  margin-top:10px;
}

/* TREINO */
.exercise{margin-top:15px;border-top:1px solid #222;padding-top:10px}
.series{display:flex;gap:6px;margin-top:6px}
input{
  background:#000;
  border:1px solid #333;
  border-radius:6px;
  color:#fff;
  padding:6px;
  width:55px;
}
.check{
  width:24px;height:24px;border-radius:50%;
  border:2px solid #444;
}
.done{background:#00e676}

/* TIMER */
.timer{
  font-size:40px;
  text-align:center;
  color:#d4ff00;
}
</style>
</head>

<body>

<div id="app">

<div class="header">
  <div class="title">DIEGO TRAINING</div>
</div>

<div id="screen"></div>

<div class="nav">
  <button onclick="go('home')" id="nav-home">Home</button>
  <button onclick="go('treino')" id="nav-treino">Treino</button>
  <button onclick="go('evol')" id="nav-evol">Evolução</button>
</div>

</div>

<script>

// =====================
// 📊 PERIODIZAÇÃO
// =====================
const periodizacao = [
{sem:1,series:3,reps:"10",rest:60},
{sem:2,series:3,reps:"8-10",rest:60},
{sem:3,series:4,reps:"6-8",rest:75},
{sem:4,series:2,reps:"12",rest:45}
];

let semana = Number(localStorage.getItem("semana")||1);
let cfg = periodizacao.find(p=>p.sem===semana);

// =====================
// 🏋️ TREINOS
// =====================
const treinos = {
Peito:["Supino","Cross","Crucifixo"],
Costas:["Barra fixa","Puxada","Remada"],
Anterior:["Agachamento","Leg press","Extensora"],
Ombros:["Desenvolvimento","Elevação","Posterior"],
Bracos:["Rosca","Tríceps","Martelo"],
Posterior:["Flexora","Stiff","Panturrilha"]
};

let atual="Peito";
let dados = JSON.parse(localStorage.getItem("dados")||"{}");
let hist = JSON.parse(localStorage.getItem("hist")||"{}");

// =====================
// 🧭 NAVEGAÇÃO
// =====================
function go(tela){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("nav-"+tela).classList.add("active");

  if(tela==="home") renderHome();
  if(tela==="treino") renderTreino();
  if(tela==="evol") renderEvol();
}

// =====================
// 🏠 HOME (AGORA FORTE)
// =====================
function renderHome(){

  document.getElementById("screen").innerHTML=`
  <div class="card">
    <div class="big">Semana ${semana}</div>
    <div>${cfg.series} séries · ${cfg.reps} reps · ${cfg.rest}s</div>
  </div>

  <div class="card">
    <div class="big">Treino de hoje</div>
    <div>${atual}</div>
    <button class="btn" onclick="go('treino')">Iniciar treino</button>
  </div>

  <div class="card">
    <div class="big">Progresso</div>
    <div>Total treinos: ${Object.keys(hist).length}</div>
  </div>
  `;
}

// =====================
// 🏋️ TREINO (GUIADO)
// =====================
function renderTreino(){

  let treino = treinos[atual];

  let html=`<div class="card"><h2>${atual}</h2>`;

  treino.forEach((ex,i)=>{

    html+=`
    <div class="exercise">
      <b>${ex}</b>

      ${renderSeries(i)}
    </div>
    `;
  });

  html+=`
  <div class="card">
    <div class="timer" id="timer">60</div>
  </div>

  <button class="btn" onclick="finalizar()">Finalizar treino</button>
  `;

  document.getElementById("screen").innerHTML=html;
}

// =====================
// 🔢 SÉRIES
// =====================
function renderSeries(i){

  let html="";

  for(let s=0;s<cfg.series;s++){

    let v = dados[atual]?.[i]?.[s] || {};

    html+=`
    <div class="series">
      <input placeholder="kg" value="${v.kg||""}"
      oninput="save(${i},${s},'kg',this.value)">

      <input placeholder="rep" value="${v.rep||""}"
      oninput="save(${i},${s},'rep',this.value)">

      <div class="check ${v.done?'done':''}"
      onclick="toggle(${i},${s})"></div>
    </div>
    `;
  }

  return html;
}

// =====================
// 💾 SAVE
// =====================
function save(i,s,k,v){
  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][i]) dados[atual][i]={};
  if(!dados[atual][i][s]) dados[atual][i][s]={};

  dados[atual][i][s][k]=v;
  localStorage.setItem("dados",JSON.stringify(dados));
}

// =====================
// ✔ CHECK + TIMER
// =====================
let tempo=60, int;

function toggle(i,s){

  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][i]) dados[atual][i]={};
  if(!dados[atual][i][s]) dados[atual][i][s]={};

  dados[atual][i][s].done = !dados[atual][i][s].done;

  localStorage.setItem("dados",JSON.stringify(dados));

  startTimer();
  renderTreino();
}

function startTimer(){
  clearInterval(int);
  tempo=cfg.rest;

  int=setInterval(()=>{
    tempo--;
    document.getElementById("timer").innerText=tempo;
    if(tempo<=0) clearInterval(int);
  },1000);
}

// =====================
// 📊 EVOLUÇÃO (GRÁFICO SEPARADO)
// =====================
function renderEvol(){

  document.getElementById("screen").innerHTML=`
  <div class="card">
    <canvas id="graf"></canvas>
  </div>
  `;

  new Chart(document.getElementById("graf"),{
    type:"line",
    data:{
      labels:["Dez","Fev","Mar"],
      datasets:[{data:[77,78,80]}]
    }
  });
}

// =====================
// FINALIZAR
// =====================
function finalizar(){

  semana++;
  if(semana>4) semana=1;

  localStorage.setItem("semana",semana);

  alert("Treino salvo 🔥");
}

// INIT
go("home");

</script>

</body>
</html>
