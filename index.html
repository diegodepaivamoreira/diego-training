<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>Diego Training PRO</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
#app{max-width:520px;margin:auto}

.title{color:#d4ff00;font-size:28px;padding:20px;font-weight:bold}

.card{background:#111;margin:10px;padding:15px;border-radius:14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.big{font-size:22px;font-weight:bold}

.chips{display:flex;gap:10px;overflow:auto;padding:10px}
.chip{background:#222;padding:10px 14px;border-radius:20px}
.active{background:#d4ff00;color:#000}

.exercise{margin-top:15px;padding-top:10px;border-top:1px solid #222}

.tag{font-size:11px;background:#222;padding:4px 8px;border-radius:6px;margin-bottom:5px}

.series{display:flex;gap:8px;margin-top:6px;align-items:center}

input{
  background:#000;border:1px solid #333;border-radius:8px;
  color:#fff;padding:6px;width:60px
}

.check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #444;
}
.done{background:#00e676}

.btn{
  background:#d4ff00;color:#000;padding:14px;
  border:none;border-radius:10px;width:100%;margin-top:15px;font-weight:bold
}

.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<div id="app">

<div class="title">DIEGO TRAINING</div>

<!-- DASHBOARD -->
<div class="card grid">
  <div><div class="small">Peso</div><div class="big">80.5kg</div></div>
  <div><div class="small">IMC</div><div class="big">24.0</div></div>
</div>

<!-- GRÁFICO -->
<div class="card">
  <canvas id="grafico"></canvas>
</div>

<!-- MENU -->
<div class="chips" id="chips"></div>

<!-- TREINO -->
<div id="treino"></div>

</div>

<script>

// 📊 GRÁFICO
new Chart(document.getElementById("grafico"),{
  type:"line",
  data:{
    labels:["Dez","Fev","Mar"],
    datasets:[{label:"Peso",data:[77.6,77.3,80.4]}]
  }
});

// ORDEM
const ordem = ["Peito","Costas","Anterior","Ombros","Bracos","Posterior"];

// TREINOS (SUA FICHA)
const treinos = {

Peito:[
["Supino declinado","Cross over","Crucifixo declinado"],
["Supino reto","Supino máquina","Crucifixo máquina"],
["Supino 45","Supino 45 máquina","Crucifixo 45"]
],

Costas:[
["Barra fixa","Puxada hammer","Puxada frente"],
["Puxada por trás","Puxada articulada","Puxada frente"],
["Remada inclinada","Remada unilateral","Remada sentada"]
],

Anterior:[
"Agachamento Smith",
"Leg press",
"Cadeira extensora",
"Agachamento unilateral",
"Cadeira adutora",
"Abdominal lateral"
],

Ombros:[
["Abdução lateral","Cross posterior","Abdução dobrada"],
["Desenvolvimento máquina","Flexão ombro","Flexão cross"],
["Desenvolvimento Smith atrás","Crucifixo inverso"],
["Encolhimento","Remada alta","Encolhimento máquina"]
],

Bracos:[
["Rosca direta","Rosca Scott","Rosca alternada"],
["Tríceps testa","Tríceps pulley","Tríceps corda"],
["Rosca martelo"]
],

Posterior:[
"Cadeira flexora",
"Mesa flexora",
"Stiff",
"Flexão joelho",
"Afundo banco",
"Panturrilha",
"Abdominal infra"
]

};

let atual="";
let dados = JSON.parse(localStorage.getItem("dados")||"{}");
let historico = JSON.parse(localStorage.getItem("historico")||"{}");

// INIT
function init(){
  let html="";
  ordem.forEach(nome=>{
    html+=`<div class="chip" onclick="abrir('${nome}',this)">${nome}</div>`;
  });
  document.getElementById("chips").innerHTML=html;
}

// ABRIR
function abrir(nome,el){
  atual=nome;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  render();
}

// RENDER
function render(){

  let treino = treinos[atual];
  if(!treino) return;

  let html=`<div class="card"><h2>${atual}</h2>`;

  treino.forEach((item,i)=>{

    html+=`<div class="exercise">`;

    if(Array.isArray(item)){
      html+=`<div class="tag">TRI-SET</div>`;
      item.forEach(e=>{
        html+=`<div>${e} ${sugestao(e)}</div>`;
      });
    }else{
      html+=`<div>${item} ${sugestao(item)}</div>`;
    }

    html+=renderSeries(i,3);

    html+=`</div>`;
  });

  html+=`<button class="btn" onclick="finalizar()">Finalizar treino</button></div>`;

  document.getElementById("treino").innerHTML = html;
}

// SERIES
function renderSeries(i,total){
  let html="";

  for(let s=0;s<total;s++){

    let val = dados[atual]?.[i]?.[s] || {};

    html+=`
    <div class="series">
      <input placeholder="kg" value="${val.kg||""}"
      oninput="save(${i},${s},'kg',this.value)">
      
      <input placeholder="rep" value="${val.rep||""}"
      oninput="save(${i},${s},'rep',this.value)">
      
      <div class="check ${val.done?'done':''}"
      onclick="toggle(${i},${s})"></div>
    </div>
    `;
  }

  return html;
}

// SAVE
function save(i,s,key,val){
  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][i]) dados[atual][i]={};
  if(!dados[atual][i][s]) dados[atual][i][s]={};

  dados[atual][i][s][key]=val;
  localStorage.setItem("dados",JSON.stringify(dados));
}

// CHECK
function toggle(i,s){
  if(!dados[atual]) dados[atual]={};
  if(!dados[atual][i]) dados[atual][i]={};
  if(!dados[atual][i][s]) dados[atual][i][s]={};

  dados[atual][i][s].done = !dados[atual][i][s].done;

  localStorage.setItem("dados",JSON.stringify(dados));
  render();
}

// PROGRESSÃO
function registrar(nome,kg,rep){

  if(!historico[nome]) historico[nome]=[];

  historico[nome].push({
    kg:Number(kg),
    rep:Number(rep)
  });

  localStorage.setItem("historico",JSON.stringify(historico));
}

// PR
function PR(nome){
  if(!historico[nome]) return "-";

  let melhor = historico[nome].reduce((m,e)=>{
    let carga = e.kg*(1+e.rep/30);
    return carga>m?carga:m;
  },0);

  return Math.round(melhor);
}

// SUGESTÃO
function sugestao(nome){

  if(!historico[nome]) return "";

  let ult = historico[nome].slice(-1)[0];
  if(!ult) return "";

  let carga = ult.kg;

  if(ult.rep>=10) carga+=2;
  if(ult.rep<6) carga-=2;

  return `<div class="small">
  Último: ${ult.kg}kg x ${ult.rep}  
  → Sug: ${carga}kg  
  PR: ${PR(nome)}
  </div>`;
}

// FINALIZAR
function finalizar(){

  treinos[atual].forEach((item,i)=>{

    if(Array.isArray(item)){
      item.forEach(e=>{
        let kg = dados[atual]?.[i]?.[0]?.kg;
        let rep = dados[atual]?.[i]?.[0]?.rep;

        if(kg && rep) registrar(e,kg,rep);
      });
    }else{
      let kg = dados[atual]?.[i]?.[0]?.kg;
      let rep = dados[atual]?.[i]?.[0]?.rep;

      if(kg && rep) registrar(item,kg,rep);
    }

  });

  alert("Treino salvo 🔥 Evolução registrada");
}

// INIT
init();

</script>

</body>
</html>
